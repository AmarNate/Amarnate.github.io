$("bMenu").onclick=openMenu;
$("sheetIn").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]"); if(!b) return;
  const a=b.dataset.m;
  if(a==="save"){ const nm=(prompt("Name this sketch:",fragName)||"").trim(); if(!nm) return;
    const s=slots(); s[nm]={t:Date.now(),n:layers.length,code:pack()};
    fragName=nm; toast(setLS(LS.slots,JSON.stringify(s))?'saved "'+nm+'"':"could not save, copy the code instead"); save(); return; }
  if(a==="load"){ const s=slots(), k=Object.keys(s).sort((x,y)=>s[y].t-s[x].t);
    sheet('<h2>Open a sketch</h2>'+(k.length?k.map(n=>'<div class="slot">'+
      '<span class="sn">'+esc(n)+'<br><span class="lbl">'+s[n].n+' layers</span></span>'+
      '<button class="mini" data-open="'+encodeURIComponent(n)+'">open</button>'+
      '<button class="mini" data-drop="'+encodeURIComponent(n)+'" style="border-color:var(--rec);color:var(--rec)">delete</button></div>').join("")
      :'<p>No saved sketches yet.</p>')+'<button class="big ghost" data-close>Close</button>'); return; }

$("sheetIn").addEventListener("click",e=>{

      :"Paste a code here and everything rebuilds.")+'</p>'+

async function doShare(){
  if(!mix().length) return toast("nothing to share yet");
  const f=new File([midiBytes()],fragName+".mid",{type:"audio/midi"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:fragName}); return; }
    if(navigator.share){ await navigator.share({title:fragName,text:pack()}); return; }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  dl(fragName+".mid",midiBytes(),"audio/midi");
}

/* =========================== GUIDE ===================================== */
function openGuide(){
  sheet('<h2>The whole thing in seven lines</h2>'+
    '<p class="gl"><b>1.</b> Tap <b>Sound</b> and pick an instrument. Real recordings, so the first tap downloads it.</p>'+
    '<p class="gl"><b>2.</b> <b>+</b> opens an empty layer if you want to pick the sound first. The <b>red button</b> is what records. Four ticks count you in, then play. That is one layer.</p>'+
    '<p class="gl"><b>3.</b> Hit red again for a second layer. What you already did plays along, so parts stack. A layer set to <b>repeat</b> cycles on whole bars at the tempo, so play to the click and it lands.</p>'+
    '<p class="gl"><b>4.</b> Tap a layer in the strip to work on it: trim the start, play only that layer, make it <b>repeat</b>, silence it, empty it.</p>'+
    '<p class="gl"><b>5.</b> <b>Shape</b> changes how a sound behaves. Try a preset first, nudge sliders after.</p>'+
    '<p class="gl"><b>6.</b> The <b>&#9678;</b> up top finds a note by ear. Higher or lower until it matches, then it names it.</p>'+
    '<p class="gl"><b>7.</b> Menu, then <b>Write it down</b>: your layers become sheet music, a MIDI file for a music app, or text to paste into an AI.</p>'+
    '<p class="gl"><b>8.</b> <b>Song</b> tab: lay layers out along the bars into a whole track. Same layer as many times as you like. Tap a note in a layer\'s picture to give just that note vibrato, a swell, a bend.</p>'+
    '<p>Every <b>?</b> in the app explains only the control next to it. Anything that is a switch or a loudness lives in <b>Menu, then Settings</b>.</p>'+
    '<p>If you hear nothing at all, check the silent switch. iOS mutes web audio with it on.</p>'+
    '<button class="big" data-close>Start</button>');
}

/* =========================== INIT ====================================== */
function fitChrome(){
  const vv=window.visualViewport;
  if(!vv){ document.documentElement.style.setProperty("--chromeT","0px"); document.documentElement.style.setProperty("--chromeB","0px"); return; }
  const top=Math.max(0,Math.round(vv.offsetTop));
  const bot=Math.max(0,Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
  document.documentElement.style.setProperty("--chromeT",top+"px");
  document.documentElement.style.setProperty("--chromeB",bot+"px");
}
fitChrome();
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitChrome);
  window.visualViewport.addEventListener("scroll",fitChrome);
}
let reT;
window.addEventListener("resize",()=>{ clearTimeout(reT); reT=setTimeout(()=>{ fitChrome(); buildKB(); },140); });
window.addEventListener("orientationchange",()=>setTimeout(()=>{ fitChrome(); buildKB(); },220));
document.addEventListener("pointerdown",()=>{ if(ctx&&ctx.state==="suspended") ctx.resume(); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ctx&&ctx.state==="suspended") ctx.resume(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
try{ const c=JSON.parse(getLS(LS.col)||"null"); if(c&&typeof c==="object") collapsed={...collapsed,...c}; }catch(e){}
if(getLS(LS.click)==="0") clickOn=false; if(getLS(LS.bars)==="0") barSnap=false;
{ const z=parseInt(getLS(LS.zoom)); if([24,36,48,72,96].includes(z)) songBW=z; }
{ const cv=parseFloat(getLS(LS.clickVol)), mv=parseFloat(getLS(LS.vol));
  if(isFinite(cv)) clickVol=Math.min(1,Math.max(0,cv)); if(isFinite(mv)) vol=Math.min(1,Math.max(0,mv)); }
const saved=getLS(LS.auto);
if(saved){ try{ adopt(unpack(saved),"restored") }catch(e){ renderStrip(); } }
else renderStrip();
buildKB(); applyCollapse(); setView("layers");
showNote((octave+1)*12,null);
if(!getLS(LS.seen)){ openGuide(); setLS(LS.seen,"1"); }
