    setLS(LS.slots,JSON.stringify(s)); toast("deleted"); closeSheet(); }
});
function showCode(val,ro){
  sheet('<h2>'+(ro?"Track code":"Paste a track code")+'</h2>'+
    '<textarea id="cd" spellcheck="false" autocapitalize="off" autocorrect="off" '+
    'aria-label="Track code"'+(ro?" readonly":"")+'>'+esc(val)+'</textarea>'+
    (ro?'<div class="row" style="margin-top:8px"><button class="btn sm zap" data-cd="all">Select all</button><button class="btn sm zap" data-cd="copy">Copy</button></div>'
       :'<div class="row" style="margin-top:8px"><button class="btn sm zap" data-cd="paste">Paste from clipboard</button><button class="btn sm" data-cd="clear">Clear</button></div>')+
    '<p>'+(ro?"This one string is the whole sketch. Copy it, paste it into Notes or message it to yourself, then Paste from clipboard on the other device."
      :"Paste from clipboard fills the box from what you last copied; then Load it. Or tap in the box and paste by hand.")+'</p>'+
    (ro?"":'<button class="big" data-cdgo>Load it</button>')+
    '<button class="big ghost" data-close>Close</button>');
  if(ro) setTimeout(()=>{ selectCode(); },60);
}
function selectCode(){ const t=$("cd"); if(!t) return false; t.focus(); t.select(); try{ t.setSelectionRange(0,t.value.length); }catch(e){} return true; }
$("sheetIn").addEventListener("click",e=>{
  const c=e.target.closest("[data-cd]");
  if(c){ const a=c.dataset.cd, t=$("cd");
    if(a==="all"){ selectCode(); toast("selected · now copy"); return; }
    if(a==="copy"){ const v=t?t.value:""; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
        .then(()=>toast("code copied")).catch(()=>{ selectCode(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
          toast(ok?"code copied":"selected · copy it by hand"); }); return; }
    if(a==="clear"){ if(t) t.value=""; return; }
    if(a==="paste"){ (navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject())
        .then(v=>{ if(t) t.value=String(v||"").trim(); if(!t||!t.value){ toast("nothing on the clipboard"); return; }
          try{ adopt(unpack(t.value),"pasted"); closeSheet(); }catch(err){ toast("that is not a Scribe code"); } })
        .catch(()=>{ if(t) t.focus(); toast("the browser will not hand over the clipboard: hold in the box and paste"); }); return; } }
  if(!e.target.closest("[data-cdgo]")) return;
  try{ adopt(unpack($("cd").value),"pasted"); closeSheet(); }
  catch(err){ toast("that code will not read"); }
});
async function doShare(){
  if(!mix().length) return toast("nothing to share yet");
  const f=new File([midiBytes()],fragName+".mid",{type:"audio/midi"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:fragName}); return; }
    if(navigator.share){ await navigator.share({title:fragName,text:pack()}); return; }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  dl(fragName+".mid",midiBytes(),"audio/midi");
}

/* =========================== GUIDE ===================================== */
/* =========================== THE TOUR (0.26) ===========================
   First visit: the screen dims and one control at a time is lit, with a card
   that says what it is. Back, next, skip, Esc. When it is done it folds into the
   guide as an index: tap a line and the app lights that control again. */
const TOUR=[
  {sel:"#strip",h:"Your layers",t:"Every take stacks here as a card. The tick says whether play includes it, \u25b6 plays it alone, \u266a silences it. + opens an empty layer; hum turns your voice into notes."},
  {sel:"#bRec",h:"Record",t:"Four ticks count you in, then play. Whatever you already recorded plays along, so parts stack. Press it again to stop."},
  {sel:"#zKb",desk:true,h:"The keyboard",t:"Your computer keys play it: the letters are printed on the keys (Z to M, then Q to U). Sound picks the instrument; the arrows move the octaves."},
  {sel:"#zKb",desk:false,h:"The keyboard",t:"Tap this strip to open it. It opens by itself when you press record. Sound picks the instrument; the arrows move the octaves."},
  {sel:"#panel",h:"The work panel",t:"The picture is the selected layer's notes. Tap one to pick it, drag it to move it, the green marks trim the start and the end. Tap the time under the picture to play from there."},
  {sel:"#seg",h:"Four views",t:"Layers is the take. Shape is how the sound behaves (try a preset first). Notes is a notepad. Song lays your layers out along the bars into a whole track."},
  {sel:"#bPlay",h:"Play",t:"Plays the ticked layers. \u00bd is half speed, \u21a9 undoes the last change."},
  {sel:"#bPlay",desk:true,h:"Your hands stay on the keys",t:"Space plays, Enter records, Ctrl+Z undoes. Esc closes whatever is open."},
  {sel:"#bTempo",h:"The tempo",t:"Beats a minute. It sets the click, where the bar lines fall, and how a repeating layer comes round. Tap it for more."},
  {sel:"#bFind",h:"Find a note by ear",t:"It plays a note and asks higher or lower until it matches what is in your head, then names it."},
  {sel:"#bMenu",h:"The menu",t:"Save and open sketches, open a MIDI file, and Write it down: sheet music, MIDI, a .wav of the mix, or stems (one file per layer) for FL Studio. Settings live here too."},
  {sel:"#bTell",desk:true,h:"Tell Nate",t:"Found something odd, broken or brilliant? This packs the version, your device and the sketch, so he sees exactly what you saw."},
  {sel:"#bMenu",desk:false,h:"Tell Nate",t:"Found something odd, broken or brilliant? Tell Nate is in the menu: it packs the version, your phone and the sketch, so he sees exactly what you saw."},
  {sel:"#bHelp",h:"This ? brings it all back",t:"The tour lives here as an index. And every small ? in the app explains only the thing next to it. Have fun."}
];
const tourSteps=()=>TOUR.filter(st=>st.desk==null||st.desk===isDesk());
let tour={on:false,i:0,spot:null,card:null,list:null};
function tourEl(st){ const el=document.querySelector(st.sel); if(!el) return null; const r=el.getBoundingClientRect(); return r.width>2&&r.height>2?el:null; }
function startTour(at){
  if(tour.on) endTour(false);
  closeSheet(); if(view!=="layers") setView("layers");
  tour.on=true; tour.list=tourSteps(); tour.i=at||0;
  tour.spot=document.createElement("div"); tour.spot.className="tour-spot";
  tour.card=document.createElement("div"); tour.card.className="tour-card";
  document.body.appendChild(tour.spot); document.body.appendChild(tour.card);
  tourShow(0); window.addEventListener("resize",tourPlace);
}
function endTour(done){
  if(!tour.on) return; tour.on=false; tour.spot.remove(); tour.card.remove(); window.removeEventListener("resize",tourPlace);
  setLS(LS.tour,"1"); if(done) toast("the tour lives under ? now");
}
function tourShow(dir){
  const L=tour.list; let guard=0;
  while(!tourEl(L[tour.i])&&guard++<L.length){ tour.i+=dir<0?-1:1; if(tour.i<0||tour.i>=L.length){ endTour(true); return; } }
  const st=L[tour.i];
  tour.card.innerHTML='<div class="ts">'+(tour.i+1)+' of '+L.length+'</div><div class="th">'+esc(st.h)+'</div><p>'+esc(st.t)+'</p>'+
    '<div class="tb">'+(tour.i?'<button class="btn sm" data-tour="back">back</button>':'')+
    '<button class="btn sm go" data-tour="next">'+(tour.i===L.length-1?'done':'next')+'</button>'+
    '<button class="btn sm" data-tour="skip" style="margin-left:auto">skip</button></div>';
  tourPlace(); const n=tour.card.querySelector('[data-tour="next"]'); if(n) n.focus({preventScroll:true});
}
function tourPlace(){
  if(!tour.on) return; const el=tourEl(tour.list[tour.i]); if(!el) return;
  const r=el.getBoundingClientRect(), p=6;
  Object.assign(tour.spot.style,{top:(r.top-p)+"px",left:(r.left-p)+"px",width:(r.width+2*p)+"px",height:(r.height+2*p)+"px"});
  const cw=tour.card.offsetWidth||340, ch=tour.card.offsetHeight||170, W=innerWidth, H=innerHeight;
  let top=r.bottom+14, left=r.left+r.width/2-cw/2;
  if(top+ch>H-10) top=r.top-ch-14;
  if(top<10){ top=Math.max(10,Math.min(H-ch-10,r.top+r.height/2-ch/2)); left=r.right+14; if(left+cw>W-10) left=r.left-cw-14; }
  left=Math.max(10,Math.min(W-cw-10,left));
  Object.assign(tour.card.style,{top:top+"px",left:left+"px"});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tour]"); if(!b||!tour.on) return; const a=b.dataset.tour;
  if(a==="next"){ if(tour.i>=tour.list.length-1) endTour(true); else { tour.i++; tourShow(1); } }
  else if(a==="back"){ if(tour.i>0){ tour.i--; tourShow(-1); } }
  else if(a==="skip") endTour(false);
});
/* the index: one line per stop; tapping it lights that control for a moment */
function tourPoint(i){
  const st=tourSteps()[i]; if(!st) return; closeSheet(); if(view!=="layers") setView("layers");
  const el=tourEl(st); if(!el){ toast("that one lives in the menu on this screen"); return; }
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); setTimeout(()=>el.classList.remove("pulse"),2600);
  toast(st.h+": "+st.t.split(". ")[0]+".");
}
$("sheetIn").addEventListener("click",e=>{ const b=e.target.closest("[data-tstep]"); if(b){ tourPoint(+b.dataset.tstep); return; }
  if(e.target.closest("[data-tourgo]")) startTour(0); });
function openGuide(){
  sheet('<h2>Tour and guide</h2>'+
    '<button class="big" data-tourgo style="margin:0 0 12px">Take the tour</button>'+
    '<div class="lbl mh" style="display:flex;align-items:center;gap:6px"><span style="flex:1">Index \u00b7 tap a line to see where it is</span><button class="qm" data-help="tour" aria-label="What the index is">?</button></div>'+
    '<div class="tindex">'+tourSteps().map((st,i)=>'<button type="button" data-tstep="'+i+'"><b>'+(i+1)+'</b>'+esc(st.h)+'</button>').join("")+'</div>'+
    (isDesk()?'<p class="note" style="margin-top:10px">On this computer: Space plays, Enter records, Ctrl+Z undoes, Esc closes. <button class="qm" data-help="keysPC" aria-label="Which keys play what">?</button></p>':'')+
    '<h2 style="margin-top:18px">The whole thing in eight lines</h2>'+
    '<p class="gl"><b>1.</b> Tap <b>Sound</b> and pick an instrument. Real recordings: the first tap downloads it, then it stays on this device. A recorded layer has its own <b>sound</b> button, so you can change its voice later, even while it plays.</p>'+
    '<p class="gl"><b>2.</b> <b>+</b> opens an empty layer if you want to pick the sound first. The <b>red button</b> is what records. Four ticks count you in, then play. That is one layer. <b>hum</b> next to it records your voice into a layer as notes, with <b>fit to key</b> to fix what your voice got wrong.</p>'+
    '<p class="gl"><b>3.</b> Hit red again for a second layer. What you already did plays along, so parts stack. A layer set to <b>repeat</b> cycles on whole bars at the tempo, so play to the click and it lands.</p>'+
    '<p class="gl"><b>4.</b> Tap a layer in the strip to work on it: trim the start, play only that layer, make it <b>repeat</b>, silence it. Punched the drums by feel? <b>Tempo from this layer</b> reads the speed out of your hits. Tap a note in the picture to move it or hold it longer.</p>'+
    '<p class="gl"><b>5.</b> <b>Shape</b> changes how a sound behaves. Try a preset first, nudge sliders after. With a note picked, Shape works on just that note: vibrato, a swell, a bend, or its own shape.</p>'+
    '<p class="gl"><b>6.</b> The <b>&#9678;</b> up top finds a note by ear. Higher or lower until it matches, then it names it.</p>'+
    '<p class="gl"><b>7.</b> Menu, then <b>Write it down</b>: your layers become sheet music, a MIDI file for a music app, or text to paste into an AI.</p>'+
    '<p class="gl"><b>8.</b> <b>Song</b> tab: lay layers out along the bars into a whole track. Same layer as many times as you like. The arrow in the dock undoes the last change.</p>'+
    '<p>Every <b>?</b> in the app explains only the control next to it. Anything that is a switch or a loudness lives in <b>Menu, then Settings</b>.</p>'+
    '<p>If you hear nothing at all, check the silent switch. iOS mutes web audio with it on.</p>'+
    '<button class="big" data-close>Start</button>');
}
$("bHelp").onclick=openGuide;
$("bTell").onclick=openTell;

/* =========================== INIT ====================================== */
const standalone=()=>window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone===true;
function fitChrome(){
  const vv=window.visualViewport;
  if(!vv||standalone()){ document.documentElement.style.setProperty("--chromeT","0px"); document.documentElement.style.setProperty("--chromeB","0px"); return; }
  const top=Math.max(0,Math.round(vv.offsetTop));
  const bot=Math.max(0,Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
  document.documentElement.style.setProperty("--chromeT",top+"px");
  document.documentElement.style.setProperty("--chromeB",bot+"px");
}
fitChrome();
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitChrome);
  window.visualViewport.addEventListener("scroll",fitChrome);
}
let reT;
window.addEventListener("resize",()=>{ clearTimeout(reT); reT=setTimeout(()=>{ fitChrome(); kbFold(); buildKB(); renderStrip(); if(view==="layers"||view==="shape") drawScope(); },140); });
window.addEventListener("orientationchange",()=>setTimeout(()=>{ fitChrome(); buildKB(); },220));
document.addEventListener("pointerdown",()=>{ if(ctx&&ctx.state==="suspended") ctx.resume(); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ctx&&ctx.state==="suspended") ctx.resume(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
try{ const c=JSON.parse(getLS(LS.col)||"null"); if(c&&typeof c==="object") collapsed={...collapsed,...c}; }catch(e){}
if(getLS(LS.click)==="0") clickOn=false; if(getLS(LS.bars)==="0") barSnap=false;
{ const z=parseInt(getLS(LS.zoom)); if([24,36,48,72,96,144,192].includes(z)) songBW=z; }
{ const cv=parseFloat(getLS(LS.clickVol)), mv=parseFloat(getLS(LS.vol));
  if(isFinite(cv)) clickVol=Math.min(1,Math.max(0,cv)); if(isFinite(mv)) vol=Math.min(1,Math.max(0,mv)); }
if(getLS(LS.fitkeys)==="0") fitKeys=false;
const saved=getLS(LS.auto);
if(saved){ try{ adopt(unpack(saved),"restored") }catch(e){ renderStrip(); } }
else renderStrip();
buildKB(); applyCollapse(); setView("layers");
showNote((octave+1)*12,null);
/* 0.26: the tour replaces the eight lines on a first visit, and shows once to anyone who had 0.25 */
if(!getLS(LS.tour)){ setTimeout(()=>{ if(!tour.on&&$("sheet").classList.contains("hidden")) startTour(0); },700); setLS(LS.seen,"1"); }
/* localStorage empty but the shelf has a sketch: the phone cleared one and not
   the other. bring it back rather than open on nothing. */
/* 0.26: and when the quick save refused a newer sketch, the shelf's newer copy wins */
kvGet("state","auto").then(v=>{ if(!v||!v.code) return; const lt=+getLS(LS.autoT)||0;
  if((!saved&&!layers.length)||(saved&&lt>0&&v.t>lt+1500&&v.code!==saved)){ try{ adopt(unpack(v.code),"brought back"); }catch(e){} } }).catch(()=>{});
lastBackup=(backups()[0]||{}).code||"";
</script>
