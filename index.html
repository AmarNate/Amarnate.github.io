  if(recL&&mode==="take"&&!recL.ev.length&&recL.takes&&recL.takes.length){
    dropTake(recL,recL.take|0); switchTake(recL,recFrom); dropped=true; }
  recL=null;
  $("bRec").classList.remove("live"); $("bRec").innerHTML="&#9679;";
  renderStrip(); paint(); save();
  toast(dropped?"nothing played · back to take "+(recFrom+1):mode==="over"?"added to the layer":skipped?"layer saved \u00b7 start at "+(skipped/1000).toFixed(2)+"s":"layer saved");
}
function startOrStop(){
  if(recording){ stopRec(); return; }
  if(hum&&hum.live){ humStopRec(); return; }
  if(!mix(0,PICK).length&&!clickOn){ startRec(); return; }   /* no click, no earlier layers: start straight away, as before */
  boot(); if(ctx.resume) ctx.resume();
  let n=0; toast("get ready");
  $("countVeil").classList.remove("hidden"); $("countNum").textContent="1";
  const tick=()=>{ if(n<4){ click(n===0); n++;
    $("countNum").textContent=String(n);
    timers.push(setTimeout(tick,Math.round(60000/(bpm*rate)))); } else startRec(); };
  tick();
}
$("bRec").onclick=startOrStop;
/* what the red button is about to do, chosen from the layer's own buttons */
/* 0.23.1: another take / keep adding play and record in the layer's own sound:
   the keyboard switches to it (pads for a drum layer) and stays there after */
function armRec(mode,id){ if(recording) return; if(playing) stop(); recMode=mode; recTarget=id;
  const L=layers.find(x=>x.id===id);
  if(L&&L.inst!==inst){ allOff(); inst=L.inst; octave=IN(inst).o; buildKB(); showNote((octave+1)*12,inst==="drums"?"kick":null); ensure(inst,true); }
  recFrom=L?(L.take|0):0;
  startOrStop(); }
let recFrom=0;
/* =========================== TAKES ====================================== */
/* a layer keeps every take. l.takes holds the ones you are not hearing, in
   order of birth; l.take is the number of the live one. switching swaps the
   notes, the trim and the hum in and out; the shape and the sound stay. */
/* 0.23.1: the take you are on goes back into its own place among the others and
   the new one is born at the end. it used to be pushed to the end, so after
   switching back to take 1 and recording again, take 1 became take 2. */
function stashTake(l){
  l.takes=allTakes(l).map(x=>({ev:x.ev,ti:x.ti,to:x.to,hum:x.hum||null}));
  l.take=l.takes.length;
}
function allTakes(l){ const all=(l.takes||[]).slice(); all.splice(l.take|0,0,{ev:l.ev,ti:l.trimIn||0,to:l.trimOut==null?null:l.trimOut,hum:l.hum||null,live:true}); return all; }
function setTakes(l,all,k){ const t=all[k]; l.ev=t.ev; l.trimIn=t.ti; l.trimOut=t.to; l.hum=t.hum||null;
  l.takes=all.filter((x,i)=>i!==k).map(x=>({ev:x.ev,ti:x.ti,to:x.to,hum:x.hum||null})); l.take=k; selN=-1; selNs=[]; }
function switchTake(l,k){ const all=allTakes(l); if(k<0||k>=all.length||k===(l.take|0)) return; setTakes(l,all,k); }
function dropTake(l,k){ const all=allTakes(l); if(all.length<2||k<0||k>=all.length) return;
  all.splice(k,1); const cur=l.take|0, nk=k<cur?cur-1:k===cur?Math.min(cur,all.length-1):cur; setTakes(l,all,nk); }
function takeChips(l){
  if(!l.takes||!l.takes.length) return '';
  const all=allTakes(l), cur=l.take|0;
  return '<div class="lbl mh" style="display:flex;align-items:center;gap:6px"><span style="flex:1">Takes</span><button class="qm" data-help="takes" aria-label="What takes are">?</button></div><div class="takes">'+
    all.map((t,k)=>'<button class="btn sm'+(k===cur?" on":"")+'" data-take="'+k+'">take '+(k+1)+' \u00b7 '+t.ev.length+(t.hum?' \u00b7 hum':'')+'</button>').join("")+
    '<button class="btn sm dan" data-droptake="'+cur+'">drop this take</button></div>';
}

/* =========================== HUM IT FIRST =============================== */
/* the mic records a hum. two things come out of it: the hum itself, kept on
   this device as a memo (never in the mix, never in a file), and the notes it
   heard, on the nearest key, in a new layer. he WILL be off: fit to key and
   the up/down steps are the second half of this feature. */
const HUM_SR=16000, HUMS={};
let humSrc=null;
function openHum(){
  if(recording||(hum&&hum.live)) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ toast("this browser has no microphone for web pages"); return; }
  hum={live:false,chunks:[],n:0,others:false,lvl:0};
  sheet('<h2>Hum it first</h2>'+
    '<p>Hum, whistle or sing the line. It lands in a new layer as notes, and the hum itself is kept so you can check against it. Being off is fine: <b style="color:var(--blue)">fit to key</b> on the layer fixes most of it, the up and down steps fix the rest.</p>'+
    '<div class="row" style="margin-bottom:6px"><button class="btn sm" data-hum="others">play the other layers while I hum: off</button>'+
    '<button class="qm" data-help="hum" aria-label="What hum it first does">?</button></div>'+
    '<p class="note">With the others on, use headphones, or the mic hears them too and they end up in the notes. The click stays on either way if it is on in Settings.</p>'+
    '<div class="humlvl"><i id="humLvl"></i></div>'+
    '<button class="big rec" data-hum="go" id="humGo">start humming</button>'+
    '<button class="big ghost" data-close>Cancel</button>');
}
$("sheetIn").addEventListener("click",e=>{
  const b=e.target.closest("[data-hum]"); if(!b||!hum) return;
  const a=b.dataset.hum;
  if(a==="others"){ hum.others=!hum.others; b.textContent="play the other layers while I hum: "+(hum.others?"on":"off"); b.classList.toggle("on",hum.others); return; }
  if(a==="go"){ if(hum.live) humStopRec(); else humStartRec(); }
});
function humStartRec(){
  boot(); if(ctx.resume) ctx.resume(); allOff(); if(playing) stop();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(stream=>{
    if(!hum){ stream.getTracks().forEach(t=>t.stop()); return; }
    const src=ctx.createMediaStreamSource(stream);
    const proc=ctx.createScriptProcessor(4096,1,1), mute=ctx.createGain(); mute.gain.value=0;
    hum.stream=stream; hum.src=src; hum.proc=proc; hum.mute=mute; hum.sr=ctx.sampleRate; hum.chunks=[]; hum.n=0;
    proc.onaudioprocess=ev=>{ if(!hum||!hum.live) return; const d=ev.inputBuffer.getChannelData(0);
      hum.chunks.push(new Float32Array(d)); hum.n+=d.length;
      let s=0; for(let i=0;i<d.length;i+=4) s+=d[i]*d[i]; hum.lvl=Math.sqrt(s/(d.length/4)); };
    src.connect(proc); proc.connect(mute); mute.connect(master);
    hum.live=true; hum.t0=performance.now();
    const g=$("humGo"); if(g){ g.textContent="stop · I have it"; g.classList.add("live"); }
    $("bRec").classList.add("live"); $("bRec").innerHTML="&#9632;";
    clickStart();
    if(hum.others){ const guide=mix(0,PICK); if(guide.length) play(guide,true); }
    const tick=()=>{ if(!hum||!hum.live) return; const el=$("humLvl"); if(el) el.style.width=Math.min(100,Math.round(hum.lvl*420))+"%"; requestAnimationFrame(tick); };
    tick();
    toast("humming… tap stop when you have it");
  }).catch(()=>{ toast("no microphone: allow it in the browser and try again"); });
}
function humStopRec(){
  if(!hum||!hum.live) return;
  hum.live=false; clickStop(); stop();
  try{ hum.src.disconnect(); hum.proc.disconnect(); hum.mute.disconnect(); }catch(e){}
  try{ hum.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  $("bRec").classList.remove("live"); $("bRec").innerHTML="&#9679;";
  const g=$("humGo"); if(g){ g.textContent="listening…"; g.classList.remove("live"); }
  const h=hum; hum=null;
  setTimeout(()=>{ try{ humFinish(h); }catch(e){ toast("could not read the hum"); closeSheet(); } },30);
}
/* 48k (or whatever the phone runs at) down to 16k mono, then YIN per 20ms */
function humFinish(h){
  const total=h.n; if(total<h.sr*.3){ toast("too short to hear anything"); closeSheet(); return; }
  const all=new Float32Array(total); let o=0; h.chunks.forEach(c=>{ all.set(c,o); o+=c.length; });
  const ratio=h.sr/HUM_SR, n=Math.floor(total/ratio), pcm=new Float32Array(n);
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), b=Math.min(total,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=all[j]; pcm[i]=s/Math.max(1,b-a); }
  const notes=humNotes(pcm,HUM_SR);
  const id=(inst==="drums")?"ooh":inst;
  const l=blankLayer(); l.inst=id; l.sh={...shape};
  l.ev=notes.map(x=>({midi:x.midi,pad:null,start:x.start,dur:x.dur}));
  l.hum={k:newId(),sr:HUM_SR,n:n};
  layers.push(l); selL=l.id; selN=-1; selNs=[];
  if(l.ev.length){ const first=firstAttack(l); if(first>80) l.trimIn=first; }
  /* keep the hum: in memory now, on the shelf for next time */
  const buf=ctx.createBuffer(1,n,HUM_SR); buf.getChannelData(0).set(pcm); HUMS[l.hum.k]=buf;
  const i16=new Int16Array(n); for(let i=0;i<n;i++) i16[i]=Math.max(-32768,Math.min(32767,Math.round(pcm[i]*32767)));
  kvPut("hums",l.hum.k,{sr:HUM_SR,pcm:i16.buffer,t:Date.now()});
  closeSheet(); ensure(id,true); renderStrip(); setView("layers"); paint(); save(); markFitKeys();
  toast(l.ev.length?l.ev.length+(l.ev.length===1?" note heard":" notes heard")+" · fit to key if it is off":"nothing with pitch heard: the hum is kept");
}
/* pitch per frame: YIN, cumulative mean normalised difference, threshold .15,
   70..1000 Hz. then frames become notes: same pitch held = one note. */
function humNotes(x,sr){
  const W=1024, HOP=Math.round(sr*.02), tMin=Math.floor(sr/1000), tMax=Math.ceil(sr/70);
  const frames=[]; const d=new Float32Array(tMax+1), c=new Float32Array(tMax+1);
  let rmsMax=0;
  for(let p=0;p+W+tMax<x.length;p+=HOP){
    let e=0; for(let i=0;i<W;i++) e+=x[p+i]*x[p+i]; const rms=Math.sqrt(e/W); if(rms>rmsMax) rmsMax=rms;
    let f0=null, conf=1;
    if(rms>.004){
      d[0]=0; for(let t=1;t<=tMax;t++){ let s=0; for(let i=0;i<W;i++){ const v=x[p+i]-x[p+i+t]; s+=v*v; } d[t]=s; }
      c[0]=1; let run=0; for(let t=1;t<=tMax;t++){ run+=d[t]; c[t]=run>0?d[t]*t/run:1; }
      let tau=-1; for(let t=tMin;t<=tMax;t++){ if(c[t]<.15){ while(t+1<=tMax&&c[t+1]<c[t]) t++; tau=t; break; } }
      if(tau<0){ let bt=tMin, bv=9; for(let t=tMin;t<=tMax;t++) if(c[t]<bv){ bv=c[t]; bt=t; } if(bv<.35) tau=bt; }
      if(tau>0){ const a=c[tau-1]||c[tau], b=c[tau], cc=c[tau+1]||c[tau], den=a-2*b+cc; const sh=den?(a-cc)/(2*den):0;
        f0=sr/(tau+sh); conf=b; }
    }
    frames.push({t:p*1000/sr,rms,f0,conf});
  }
  const thr=Math.max(.006,rmsMax*.12);
  const midi=frames.map(f=>(f.f0&&f.rms>thr&&f.conf<.3)?69+12*Math.log2(f.f0/440):null);
  /* a short median to calm the flicker, then runs of one pitch */
  const sm=midi.map((m,i)=>{ if(m==null) return null; const w=[]; for(let k=-2;k<=2;k++){ const v=midi[i+k]; if(v!=null) w.push(v); }
    w.sort((a,b)=>a-b); return w[w.length>>1]; });
  const out=[]; let cur=null;
  const close=(endT)=>{ if(!cur) return; const ms=cur.ms.slice().sort((a,b)=>a-b), m=Math.round(ms[ms.length>>1]);
    const dur=endT-cur.t; if(dur>=90) out.push({midi:clampM(m),start:Math.round(cur.t),dur:Math.round(dur)}); cur=null; };
  let gap=0;
  sm.forEach((m,i)=>{ const t=frames[i].t;
    if(m==null){ gap++; if(cur&&gap>=2) close(frames[i-gap+1].t); return; }
    gap=0;
    if(cur){ const ref=cur.ms.slice().sort((a,b)=>a-b)[cur.ms.length>>1]; if(Math.abs(m-ref)>=.75){ close(t); } }
    if(!cur) cur={t,ms:[m]}; else cur.ms.push(m); });
  if(cur) close(frames[frames.length-1].t+20);
  /* same note twice with a hair between: one note */
  const merged=[]; out.forEach(n=>{ const p=merged[merged.length-1];
    if(p&&p.midi===n.midi&&n.start-(p.start+p.dur)<60){ p.dur=n.start+n.dur-p.start; } else merged.push(n); });
  return merged;
}

      $("nSub").textContent="getting "+I.n.toLowerCase()+" "+Math.round(r.n/r.total*100)+"%"; })
    .then(ok=>{ $("nSub").textContent=IN(inst).n; if(id===inst) markRange();

      return ok; });

/* download all = put every sound on the shelf. nothing is decoded here: a

let loadingAll=false;
function loadAll(){
  if(loadingAll){ toast("already downloading"); return; }
  const ids=DB.IDS.filter(i=>IN(i).sf&&!packKept(i)&&packState(i)!=="ready");
  if(!ids.length){ toast("every sound is already on this device"); return; }
  let i=0, failed=0; loadingAll=true; toast("keeping "+ids.length+" sounds on this device");
  const sub=$("nSub");
  const next=()=>{ if(i>=ids.length){ loadingAll=false; sub.textContent=IN(inst).n;
      toast(failed?"done · "+failed+" could not be fetched, they will try again later":"all "+DB.IDS.filter(x=>IN(x).sf).length+" sounds are on this device"); return; }
    const id=ids[i++], I=IN(id); sub.textContent="keeping "+I.n.toLowerCase()+" · "+i+" of "+ids.length;
    fetchRaw(I,p=>{ sub.textContent="keeping "+I.n.toLowerCase()+" "+Math.round(p.n/p.total*100)+"% · "+i+" of "+ids.length; })
      .then(raw=>{ if(!raw) failed++; next(); }); };
  next();
}

/* =========================== SAVE / SHARE ============================== */

    const hasSh=e.sh&&typeof e.sh==="object", hasRd=e.rawDur!=null&&Math.round(e.rawDur)!==e.dur;

const packHum=h=>h&&h.k?{k:h.k,sr:h.sr||HUM_SR,n:h.n|0}:undefined;

    layers:st.layers.map(l=>({i:l.inst,l:l.loop?1:0,m:l.mute?1:0,id:l.id,s:l.sh,g:Math.round(layVol(l)*100)/100,

function unpack(code){

    const p=s.split("|"), out=[];
    (p[2]||"").split(";").filter(Boolean).forEach(r=>{

      const id=fixId(DB.V1_IDS[f[0]]); if(!id) return;
      out.push({inst:id,midi:id==="drums"?padAt(f[1]).m:clampM(f[1]),
        pad:id==="drums"?padAt(f[1]).id:null,start:Math.max(0,f[2]|0),dur:Math.max(40,f[3]|0)}); });
    return {name:"imported",shape:{...DB.SHAPE0},pi:0,projects:[{name:"Project 1",st:{notepad:"",anchorId:null,bpm:DB.BPM0,song:[],joins:[],

  }

    return {name:String(o.name||"sketch").slice(0,60),shape:shp,projects:pj,pi:Math.max(0,Math.min(pj.length-1,o.pi|0))};

function readState(o,legacy){

    const id=fixId(l.i);

      ev:g[id].map(f=>({midi:id==="drums"?padAt(f[1]).m:clampM(f[1]),

}
function readJoins(raw,L){

function readSong(raw,L){ const S=[], ids=new Set(L.map(l=>l.id));
  (Array.isArray(raw)?raw:[]).slice(0,400).forEach(b=>{ if(!Array.isArray(b)||!ids.has(b[0])) return;
    S.push({id:newId(),lay:b[0],bar:snap16(+b[1]||0),reps:Math.max(1,Math.min(64,b[2]|0||1))}); });
  return S; }
const c01=x=>Math.max(0,Math.min(1,+x||0));
function readFx(a){ const fx={v:c01(a[0]),s:c01(a[1]),f:c01(a[2]),b:Math.max(-1,Math.min(1,+a[3]||0)),t:a[4]?1:0,vr:a[5]==null?.5:c01(a[5])}; return fxAny(fx)?fx:undefined; }
const clampBpm=v=>{ v=Math.round(+v); return isFinite(v)&&v>0?Math.min(DB.BPM_MAX,Math.max(DB.BPM_MIN,v)):DB.BPM0; };
function adopt(o,label){

/* =========================== PROJECTS (0.24) =========================== */
function loadProj(i){

  layers=d.layers||[]; song=d.song||[]; bpm=d.bpm||DB.BPM0; anchorId=d.anchorId||null; joins=d.joins||[]; notepad=d.notepad||"";

function switchProject(i){

    if(L&&L.s===n.s){ if(!L.n.some(x=>x.midi===n.midi&&x.pad===n.pad)) L.n.push(n); L.d=Math.max(L.d,n.d); }
    else g.push({s:n.s,d:n.d,n:[n]}); });

    if(a>best.v) best={v:a,pc:r,minor:false}; if(b>best.v) best={v:b,pc:r,minor:true}; }

  if(a==="bars"){ barSnap=!barSnap; setLS(LS.bars,barSnap?"1":"0");
    const b=$("barsB"); b.classList.toggle("on",barSnap); b.textContent=barSnap?"repeats on whole bars: on":"repeats on whole bars: off";
    renderStrip(); if(view==="layers") drawScope(); return; }
  if(a==="grid"){ grid=grid===4?2:4; $("gridB").textContent=grid===4?"detail: fine (16ths)":"detail: coarse (8ths)"; return; }
  if(a==="fitkeys"){ fitKeys=!fitKeys; setLS(LS.fitkeys,fitKeys?"1":"0");
    const b=$("fitB"); b.classList.toggle("on",fitKeys); b.textContent=fitKeys?"mark the keys that fit: on":"mark the keys that fit: off"; markFitKeys(); return; }
  if(a==="half"){ if(takeLive()){ toast("stop the take first"); return; } $("bHalf").click(); const b=$("halfB"); b.classList.toggle("on",rate<1); b.textContent=rate<1?"half speed: on":"half speed: off"; return; }
  if(a==="tap"){ const now=performance.now(); taps=taps.filter(t=>now-t<3000); taps.push(now);
    if(taps.length>=3){ let d=0; for(let i=1;i<taps.length;i++) d+=taps[i]-taps[i-1];
      setBpm(60000/(d/(taps.length-1))); toast(bpm+" a minute"); } else toast("keep tapping"); return; }
  if(!activeMix().length){ toast("nothing to write down yet"); return; }
  if(a==="xml"){ dl(fragName+".musicxml",musicXml(),"application/vnd.recordare.musicxml+xml"); toast("sheet music saved"); return; }
  if(a==="midi"){ const CH=chanMap(activeMix()); if(CH._over>0) toast("more than 15 instruments, some will share a sound");
    dl(fragName+".mid",midiBytes(),"audio/midi"); toast("MIDI saved"); return; }
  if(a==="abc"){ dl(fragName+".abc",abcOut()); toast("text score saved"); return; }
  if(a==="text"){ dl(fragName+".txt",textOut()); toast("note list saved"); return; }
});
function textOut(){
  let s="THE SCRIBE - "+fragName+"\nv"+DB.version+"\n"+bpm+" beats per minute \u00b7 feels like "+detectKey(pitchedMidis()).name+"\n\n";
  if(layers.length){ s+="LAYERS\n";
    layers.forEach((l,i)=>{ s+="  "+(i+1)+". "+IN(l.inst).n.padEnd(11)+l.ev.length+" notes, "+
      (layLen(l)/1000).toFixed(1)+"s"+(l.loop?" (repeats)":"")+(l.mute?" (silenced)":"")+"\n"; }); }
  if(notepad.trim()) s+="\nNOTEPAD\n"+notepad.split("\n").map(x=>"  "+x).join("\n")+"\n";
  s+="\nNOTES\n";
  const mx=mix();
  DB.IDS.forEach(id=>{ const rows=mx.filter(e=>e.inst===id); if(!rows.length) return;
    s+="== "+IN(id).n.toUpperCase()+" ==\n";
    rows.forEach(e=>{ const n=e.pad?((DB.PADS.find(p=>p.id===e.pad)||{}).n||"drum"):mName(e.midi);
      s+="  "+(e.start/1000).toFixed(2).padStart(7)+"s  "+n.padEnd(9)+
         "  held "+(e.dur/1000).toFixed(2)+"s\n"; });
    s+="\n"; });
  s+="\nTRACK CODE\n"+pack()+"\n";
  return s;
}
function dl(name,data,type){
  const b=new Blob([data],{type:type||"text/plain"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u) },1800);
}
/* menu is three things: this sketch, sending it somewhere, the app itself.
   write it down and settings are their own sheets; help can come back here. */
function openMenu(){
  const ready=DB.IDS.filter(i=>IN(i).sf&&(packState(i)==="ready"||packKept(i))).length, all=DB.IDS.filter(i=>IN(i).sf).length;
  sheet('<h2>Menu</h2>'+
    '<div class="lbl mh">This sketch \u00b7 '+esc(fragName)+'</div>'+
    '<div class="grid2" style="margin-bottom:6px">'+
    '<button class="btn sm" data-m="save">Save this sketch</button>'+
    '<button class="btn sm" data-m="load">Open a sketch</button></div>'+
    '<div class="grid2" style="margin-bottom:6px">'+
    '<button class="btn sm" data-m="copy">Copy track code</button>'+
    '<button class="btn sm" data-m="paste">Paste track code</button></div>'+
    '<p class="note">The track code is the whole sketch as one string: paste it anywhere, load it anywhere.</p>'+
    '<div class="grid2" style="margin-bottom:6px">'+
    '<button class="btn sm go" data-m="savenow">Save now</button>'+
    '<button class="btn sm" data-m="recover">Recover</button></div>'+
    '<p class="note">Saving is always on: after every change and when you leave. Save now also keeps a backup; Recover lists the last six. <button class="qm" data-help="savenow" aria-label="How saving works">?</button></p>'+
    '<div class="lbl mh">Send it somewhere</div>'+
    '<button class="btn sm on" data-m="export" style="width:100%;margin-bottom:6px">Write it down: sheet music, MIDI, text score</button>'+
    '<button class="btn sm" data-m="share" style="width:100%;margin-bottom:6px">Share the MIDI file</button>'+
    '<div class="lbl mh">The app</div>'+
    '<div class="grid2" style="margin-bottom:6px">'+
    '<button class="btn sm" data-m="settings">Settings</button>'+
    '<button class="btn sm" data-m="guide">Guide</button></div>'+
    '<p class="note">'+ready+' of '+all+' sounds on this device. '+(getLS(LS.auto)?"Saved on this device automatically.":"This browser is blocking saving: use copy track code.")+'</p>'+
    '<button class="btn sm dan" data-m="wipe" style="width:100%;margin-top:4px">New sketch (deletes every layer)</button>'+
    '<button class="big ghost" data-close>Close</button>');
}
function tempoBlock(){
  return '<div class="tempo"><button class="btn sm" data-x="tdn" aria-label="Slower">&minus;</button>'+
    '<div class="tv"><span id="tv">'+bpm+'</span><small>beats per minute</small></div>'+
    '<button class="btn sm" data-x="tup" aria-label="Faster">+</button></div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm" data-x="tap">tap the beat</button>'+
    '<button class="qm" data-help="tempo" aria-label="What tempo does">?</button></div>';
}
function sliderRow(key,label,help,val){
  return '<div class="sl"><div class="st"><span>'+label+'</span><span class="sv" id="sv_set_'+key+'">'+Math.round(val*100)+'%</span>'+
    '<button class="qm" data-help="'+help+'" aria-label="What this does">?</button></div>'+
    '<input type="range" min="0" max="100" step="1" id="set_'+key+'" data-set="'+key+'" value="'+Math.round(val*100)+'" aria-label="'+label+'"></div>';
}
function openSettings(){
  sheet('<h2>Settings</h2>'+
    '<div class="lbl mh">Loudness</div>'+
    sliderRow("vol","Everything","vol",vol)+
    sliderRow("clickVol","The click","clickVol",clickVol)+
    '<div class="lbl mh">Recording</div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(clickOn?" on":"")+'" data-x="click" id="clickB">'+(clickOn?"click while recording: on":"click while recording: off")+'</button>'+
    '<button class="qm" data-help="click" aria-label="What the click is">?</button></div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(barSnap?" on":"")+'" data-x="bars" id="barsB">'+(barSnap?"repeats on whole bars: on":"repeats on whole bars: off")+'</button>'+
    '<button class="qm" data-help="barsnap" aria-label="What bar repeats are">?</button></div>'+
    '<div class="lbl mh">Keyboard</div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(fitKeys?" on":"")+'" data-x="fitkeys" id="fitB">'+(fitKeys?"mark the keys that fit: on":"mark the keys that fit: off")+'</button>'+
    '<button class="qm" data-help="fitkeys" aria-label="What the marks are">?</button></div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(rate<1?" on":"")+'" data-x="half" id="halfB">'+(rate<1?"half speed: on":"half speed: off")+'</button>'+
    '<button class="qm" data-help="half" aria-label="What half speed is">?</button></div>'+
    '<div class="lbl mh">The beat</div>'+tempoBlock()+
    '<p class="note">The tempo belongs to the sketch and rides in the track code. It never changes what you played, only the count-in, the click, and how it is written down.</p>'+
    '<div class="lbl mh">Sounds</div>'+
    '<div class="grid2" style="margin-bottom:6px"><button class="btn sm" data-m="sounds">Download all sounds</button>'+
    '<button class="btn sm" data-m="guide">Show the guide</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="qm" data-help="settings" aria-label="What settings is">?</button>'+
    '<button class="big ghost" data-m="menu" style="margin:0">Back to menu</button></div>');
}
function syncSheetSliders(){
  const a=$("set_vol"), b=$("set_clickVol");
  if(a){ a.value=Math.round(vol*100); $("sv_set_vol").textContent=Math.round(vol*100)+"%"; }
  if(b){ b.value=Math.round(clickVol*100); $("sv_set_clickVol").textContent=Math.round(clickVol*100)+"%"; }
}
$("sheetIn").addEventListener("input",e=>{
  const r=e.target.closest("[data-set]"); if(!r) return;
  const v=Math.min(1,Math.max(0,(+r.value||0)/100));
  if(r.dataset.set==="vol"){ vol=v; if(master) master.gain.value=vol; setLS(LS.vol,String(vol)); }
  else { clickVol=v; setLS(LS.clickVol,String(clickVol)); }
  $("sv_set_"+r.dataset.set).textContent=Math.round(v*100)+"%";
});
$("sheetIn").addEventListener("change",e=>{
  const r=e.target.closest("[data-set]"); if(!r) return;
  boot(); if(ctx.resume) ctx.resume();
  if(r.dataset.set==="clickVol") click(true); else hear(voice(inst==="drums"?"piano":inst,60,DB.SHAPE0),220);
});
$("bMenu").onclick=openMenu;
$("sheetIn").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]"); if(!b) return;
  const a=b.dataset.m;
  if(a==="save"){ const nm=(prompt("Name this sketch:",fragName)||"").trim(); if(!nm) return;
    const s=slots(); s[nm]={t:Date.now(),n:layers.length,code:pack()};
    fragName=nm; toast(setLS(LS.slots,JSON.stringify(s))?'saved "'+nm+'"':"could not save, copy the code instead"); save(); return; }
  if(a==="load"){ const s=slots(), k=Object.keys(s).sort((x,y)=>s[y].t-s[x].t);
    sheet('<h2>Open a sketch</h2>'+(k.length?k.map(n=>'<div class="slot">'+
      '<span class="sn">'+esc(n)+'<br><span class="lbl">'+s[n].n+' layers</span></span>'+
      '<button class="mini" data-open="'+encodeURIComponent(n)+'">open</button>'+
      '<button class="mini" data-drop="'+encodeURIComponent(n)+'" style="border-color:var(--rec);color:var(--rec)">delete</button></div>').join("")
      :'<p>No saved sketches yet.</p>')+'<button class="big ghost" data-close>Close</button>'); return; }
  if(a==="copy"){ const c=pack();
    (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject())
      .then(()=>{ toast("code copied"); showCode(c,true); }).catch(()=>showCode(c,true)); return; }
  if(a==="paste"){ showCode("",false); return; }
  if(a==="savenow"){ saveNow(); return; }
  if(a==="recover"){ openRecover(); return; }
  if(a==="export"){ openExport(); return; }
  if(a==="settings"){ openSettings(); return; }
  if(a==="menu"){ openMenu(); return; }
  if(a==="guide"){ openGuide(); return; }
  if(a==="share"){ doShare(); return; }
  if(a==="sounds"){ closeSheet(); loadAll(); return; }
  if(a==="wipe"){ if(confirm("Start a new sketch? Every project and every layer is deleted.")){ if(playing) stop(); layers=[]; song=[]; selB=null; selN=-1; selL=null; anchorId=null; joins=[];
    projects=[{id:newId(),name:"Project 1",data:null}]; projIdx=0; hist=[]; future=[];
    renderStrip(); paint(); save(); closeSheet(); toast("new sketch"); } return; }
});
$("sheetIn").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"), d=e.target.closest("[data-drop]");
  const s=slots();
  if(o){ const n=decodeURIComponent(o.dataset.open);
    try{ adopt(unpack(s[n].code),'"'+n+'"'); closeSheet(); }catch(err){ toast("that sketch will not read"); } }
  if(d){ const n=decodeURIComponent(d.dataset.drop); delete s[n];
    setLS(LS.slots,JSON.stringify(s)); toast("deleted"); closeSheet(); }
});
function showCode(val,ro){
  sheet('<h2>'+(ro?"Track code":"Paste a track code")+'</h2>'+
    '<textarea id="cd" spellcheck="false" autocapitalize="off" autocorrect="off" '+
    'aria-label="Track code"'+(ro?" readonly":"")+'>'+esc(val)+'</textarea>'+
    (ro?'<div class="row" style="margin-top:8px"><button class="btn sm zap" data-cd="all">Select all</button><button class="btn sm zap" data-cd="copy">Copy</button></div>'
       :'<div class="row" style="margin-top:8px"><button class="btn sm zap" data-cd="paste">Paste from clipboard</button><button class="btn sm" data-cd="clear">Clear</button></div>')+
    '<p>'+(ro?"This one string is the whole sketch. Copy it, paste it into Notes or message it to yourself, then Paste from clipboard on the other device."
      :"Paste from clipboard fills the box from what you last copied; then Load it. Or tap in the box and paste by hand.")+'</p>'+
    (ro?"":'<button class="big" data-cdgo>Load it</button>')+
    '<button class="big ghost" data-close>Close</button>');
  if(ro) setTimeout(()=>{ selectCode(); },60);
}
function selectCode(){ const t=$("cd"); if(!t) return false; t.focus(); t.select(); try{ t.setSelectionRange(0,t.value.length); }catch(e){} return true; }
$("sheetIn").addEventListener("click",e=>{
  const c=e.target.closest("[data-cd]");
  if(c){ const a=c.dataset.cd, t=$("cd");
    if(a==="all"){ selectCode(); toast("selected · now copy"); return; }
    if(a==="copy"){ const v=t?t.value:""; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
        .then(()=>toast("code copied")).catch(()=>{ selectCode(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
          toast(ok?"code copied":"selected · copy it by hand"); }); return; }
    if(a==="clear"){ if(t) t.value=""; return; }
    if(a==="paste"){ (navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject())
        .then(v=>{ if(t) t.value=String(v||"").trim(); if(!t||!t.value){ toast("nothing on the clipboard"); return; }
          try{ adopt(unpack(t.value),"pasted"); closeSheet(); }catch(err){ toast("that is not a Scribe code"); } })
        .catch(()=>{ if(t) t.focus(); toast("the browser will not hand over the clipboard: hold in the box and paste"); }); return; } }
  if(!e.target.closest("[data-cdgo]")) return;
  try{ adopt(unpack($("cd").value),"pasted"); closeSheet(); }
  catch(err){ toast("that code will not read"); }
});
async function doShare(){
  if(!mix().length) return toast("nothing to share yet");
  const f=new File([midiBytes()],fragName+".mid",{type:"audio/midi"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:fragName}); return; }
    if(navigator.share){ await navigator.share({title:fragName,text:pack()}); return; }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  dl(fragName+".mid",midiBytes(),"audio/midi");
}

/* =========================== GUIDE ===================================== */
function openGuide(){
  sheet('<h2>The whole thing in eight lines</h2>'+
    '<p class="gl"><b>1.</b> Tap <b>Sound</b> and pick an instrument. Real recordings: the first tap downloads it, then it stays on this device. A recorded layer has its own <b>sound</b> button, so you can change its voice later, even while it plays.</p>'+
    '<p class="gl"><b>2.</b> <b>+</b> opens an empty layer if you want to pick the sound first. The <b>red button</b> is what records. Four ticks count you in, then play. That is one layer. <b>hum</b> next to it records your voice into a layer as notes, with <b>fit to key</b> to fix what your voice got wrong.</p>'+
    '<p class="gl"><b>3.</b> Hit red again for a second layer. What you already did plays along, so parts stack. A layer set to <b>repeat</b> cycles on whole bars at the tempo, so play to the click and it lands.</p>'+
    '<p class="gl"><b>4.</b> Tap a layer in the strip to work on it: trim the start, play only that layer, make it <b>repeat</b>, silence it. Punched the drums by feel? <b>Tempo from this layer</b> reads the speed out of your hits. Tap a note in the picture to move it or hold it longer.</p>'+
    '<p class="gl"><b>5.</b> <b>Shape</b> changes how a sound behaves. Try a preset first, nudge sliders after. With a note picked, Shape works on just that note: vibrato, a swell, a bend, or its own shape.</p>'+
    '<p class="gl"><b>6.</b> The <b>&#9678;</b> up top finds a note by ear. Higher or lower until it matches, then it names it.</p>'+
    '<p class="gl"><b>7.</b> Menu, then <b>Write it down</b>: your layers become sheet music, a MIDI file for a music app, or text to paste into an AI.</p>'+
    '<p class="gl"><b>8.</b> <b>Song</b> tab: lay layers out along the bars into a whole track. Same layer as many times as you like. The arrow in the dock undoes the last change.</p>'+
    '<p>Every <b>?</b> in the app explains only the control next to it. Anything that is a switch or a loudness lives in <b>Menu, then Settings</b>.</p>'+
    '<p>If you hear nothing at all, check the silent switch. iOS mutes web audio with it on.</p>'+
    '<button class="big" data-close>Start</button>');
}
$("bHelp").onclick=openGuide;

/* =========================== INIT ====================================== */
const standalone=()=>window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone===true;
function fitChrome(){
  const vv=window.visualViewport;
  if(!vv||standalone()){ document.documentElement.style.setProperty("--chromeT","0px"); document.documentElement.style.setProperty("--chromeB","0px"); return; }
  const top=Math.max(0,Math.round(vv.offsetTop));
  const bot=Math.max(0,Math.round(window.innerHeight-(vv.height+vv.offsetTop)));
  document.documentElement.style.setProperty("--chromeT",top+"px");
  document.documentElement.style.setProperty("--chromeB",bot+"px");
}
fitChrome();
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitChrome);
  window.visualViewport.addEventListener("scroll",fitChrome);
}
let reT;
window.addEventListener("resize",()=>{ clearTimeout(reT); reT=setTimeout(()=>{ fitChrome(); buildKB(); },140); });
window.addEventListener("orientationchange",()=>setTimeout(()=>{ fitChrome(); buildKB(); },220));
document.addEventListener("pointerdown",()=>{ if(ctx&&ctx.state==="suspended") ctx.resume(); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ctx&&ctx.state==="suspended") ctx.resume(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
try{ const c=JSON.parse(getLS(LS.col)||"null"); if(c&&typeof c==="object") collapsed={...collapsed,...c}; }catch(e){}
if(getLS(LS.click)==="0") clickOn=false; if(getLS(LS.bars)==="0") barSnap=false;
{ const z=parseInt(getLS(LS.zoom)); if([24,36,48,72,96,144,192].includes(z)) songBW=z; }
{ const cv=parseFloat(getLS(LS.clickVol)), mv=parseFloat(getLS(LS.vol));
  if(isFinite(cv)) clickVol=Math.min(1,Math.max(0,cv)); if(isFinite(mv)) vol=Math.min(1,Math.max(0,mv)); }
if(getLS(LS.fitkeys)==="0") fitKeys=false;
const saved=getLS(LS.auto);
if(saved){ try{ adopt(unpack(saved),"restored") }catch(e){ renderStrip(); } }
else renderStrip();
buildKB(); applyCollapse(); setView("layers");
showNote((octave+1)*12,null);
if(!getLS(LS.seen)){ openGuide(); setLS(LS.seen,"1"); }
/* localStorage empty but the shelf has a sketch: the phone cleared one and not
   the other. bring it back rather than open on nothing. */
if(!saved){ kvGet("state","auto").then(v=>{ if(v&&v.code&&!layers.length){ try{ adopt(unpack(v.code),"brought back"); }catch(e){} }
  }).catch(()=>{}); }
lastBackup=(backups()[0]||{}).code||"";
</script>
