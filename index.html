  HELP:Object.freeze({
    layers:"A layer is one pass. + opens an empty one so you can pick the sound and shape it first; the red button is what records. Layers stack, so a second part plays on top of the first. The tick on a card says whether play includes that layer.",
    proj:"A project is its own set of layers, with its own song and tempo. The name above the layers switches between them, makes a new one, renames, copies or deletes. Play and the red button only ever work inside the project you are in. The whole sketch, every project, rides in one track code.",
    pick:"Ticked layers are what play plays, and what you hear under the red button while you record. Untick a layer to leave it out without silencing it. Play all ignores the ticks and plays the whole project.",
    playall:"Plays every layer in this project together, ticked or not. Silenced layers stay quiet.",
    moveproj:"Moves this layer, with its takes and its hum, into another project. It leaves this project's song.",
    find:"Plays a note and asks higher or lower until it matches what you hear, then tells you which note it was.",
    sound:"Which instrument the keyboard plays. Real recordings, so each one downloads the first time you use it.",
    range:"Moves the keyboard up or down. The note names on the keys always tell you where you are.",
    rec:"Records into the selected empty layer, or starts a new one. Whatever you already recorded plays back so you can play along with it. + is not record: + only opens a blank layer.",
    play:"Plays the ticked layers of this project. Layers that are sounding light up. Play all, next to the project name, plays every layer; the Song has its own play on its page.",
    layVol:"How loud this layer is against the others. It does not touch the loudness of the whole app; that lives in Settings.",
    loop:"This layer repeats instead of playing once.",
    anchor:"Every repeating layer loops in whole bars at the tempo: a take that lasts 3.9 bars repeats every 4, so the next round waits for the bar line. That wait is the gap you hear after a take that ends early. The anchor is the one repeating layer whose cycle every other repeat follows, so they stay lined up. An empty layer never sets the cycle.",
    onoff:"Silences this layer without deleting it.",
    empty:"Removes the notes but keeps the layer, so you can record into it again.",
    shapeBite:"How the note starts, on every sound but drums. Low is a slow swell in (nearly a second). The middle eases. High smacks: the note comes in over its own loudness for a moment, so even a recording with a soft start hits.",
    shapeFade:"How fast a note dies on its own, on every sound but drums. Halfway already cuts a long note to half a second; all the way up and it collapses the instant you hit it.",
    shapeLen:"How long a note carries on after you let go of the key.",
    shapeTail:"A tiny bit of room right after the note, so silence never fully lands before the next one.",
    shapeRoom:"How big the room is. Low is the note sitting next to you. High is the note in a big stone hall, hanging in the air after.",
    shapeEcho:"The note answers itself a moment later, quieter each time.",
    shapeDark:"Closes the top of the sound down. A little and the note is duller from the first moment; all the way and it sinks into a muffled hum as it goes. Works on every sound, drums too.",
    shapeWarp:"The pitch drifts a little while the note sounds, like the take is breathing. Low is a slow sway, high is seasick. Auto-tune switches it off while it is stepping.",
    shapeHarm:"The same recording sung again on top of itself: first a fifth up, then an octave, then a third, then an octave below. Each copy sits a hair off pitch so the stack breathes. This is the Hide and Seek sound: one voice becoming a choir of itself.",
    shapeBreath:"Air on the note: a thin, high hiss that comes in with it and settles. What makes a voice sound close and gentle instead of clean and far.",
    shapeGrit:"Rasp. The sound is pushed until its edges roughen, then brought back down so it is not just louder. A little is warmth, a lot is a torn throat.",
    shapeSwirl:"A slow whoosh moving through the sound, like it is turning in the air. Low is a gentle turn, high is a jet going over.",
    shapeDouble:"A second copy of the note a few thousandths of a second behind, wandering. One voice becomes two people singing the same line.",
    shapePulse:"The loudness beats. Low is a slow shimmer, high is a hard throb.",
    shapeChrome:"The sci-fi voice. The note is multiplied by a low tone so it turns metallic and robotic, with a crunchy stepped copy underneath. Low is a hint of machine, high is a dalek. Stack it with Auto-tune for the full robot.",
    shapeTune:"The auto-tune sound. When one note runs straight into the next, the pitch does not slide there, it steps there, one semitone at a time: the yodel. Past halfway it also flicks a semitone now and then while a note holds. Play notes back to back (or hold one key while pressing the next) to hear it.",
    dressNotes:"If notes are picked in the picture, Shape changes only those notes and the rest of the layer stays as it was. If nothing is picked, Shape changes the whole layer. With no layer selected it shapes the keyboard.",
    pickMore:"Turn this on, then tap notes in the picture to pick several at once. Whatever you do next (move, hold, a touch, a shape) happens to all of them.",
    handTo:"Hands the ending of this layer to another one: the last note here fades out while the first note there swells in, so one part can walk into the next. Echo leaves an answer behind; hall leaves air between them.",
    undo:"Takes back the last change to notes, layers or the song. The arrow in the dock is the same thing.",
    resetLay:"Puts this layer's shape back to 'as it is', clears the evened holds and any shape given to single notes. The notes themselves stay.",
    resetSong:"Takes every block off the song line. The layers themselves stay.",
    evenHolds:"Some notes you held longer than others. This slides every hold toward one length so the layer speaks more evenly. 0 keeps what you played. 100 makes every note the length below.",
    holdLen:"The length every hold walks toward. Short is a tap, long is a sung note. Moving it evens the holds all the way if they were not evened yet.",
    nudge:"Moves only the picked notes, one step of the beat at a time. Earlier / later slide them. Shorter / longer change how long they ring. The rest of the layer stays put. If a note goes past the trim, the trim opens to keep it.",
    pitch:"Moves the picked notes (or the whole layer) up or down in pitch. A step is the next key on the keyboard, black keys included. An octave is the same note higher or lower: twelve steps. Drums have no pitch, so they stay.",
    dragNote:"Tap a note in the picture to pick it. Drag it to slide it in time. The buttons below move only the picked notes, so pick several if three of six should move together.",
    notes:"A notepad for writing a line down when you have no time to play it. Your own shorthand, nothing to learn.",
    preset:"A stamp is a whole shape in one tap. Stamps stack in order: a later stamp wins where two set the same slider, and a value shows which stamp set it (\u00b7 02 = the second). The x on a stamp takes it back off and its values go with it. As it is clears the whole stack. A slider you move yourself stays yours until a later stamp sets it.",
    roll:"The rolled R. The note is held but chopped at tongue-trill speed, and every burst swells in the middle: quiet r's rising into hard R's and back. Then a gap, then the next burst, each one shorter. Speed is the tongue, Bursts how many, Between bursts runs from a dip to dead silence. Stack it with bend down for the drop.",
    wub:"The pitch holds, the tone opens and closes: muffled to bright to muffled, over and over. The dubstep bass thing. Speed is how fast it opens, Depth is how far.",
    wah:"One sweep, muffled to bright, across the note. Sweep is how much of the note it takes.",
    stairs:"A bend down that drops in semitone steps instead of sliding. A robotic fall. Drop is how far it falls.",
    slidefrom:"The note glides in from the pitch of the note before it instead of starting on its own. What your voice does when you hum. Glide is how long it takes to arrive. The first note of a line has nothing to slide from.",
    hiccup:"A tiny octave-up blip at the very start, then the real note.",
    choke:"The note is cut dead at a point you pick, instead of fading. Drums and stabs love it.",
    oneecho:"Just this note repeats, fading, two or three times, without the whole layer having echo.",
    trim:"The layer starts when the first note lands, so the second you spent getting ready is not part of the take. Drag the green marks on the picture, or use Start from and Cut after, to keep or cut more. A note you move outside the cut opens the cut back up.",
    playLayer:"Plays only this layer, with its trim. The big play button still plays everything together.",
    tempo:"How many beats go by in a minute. It sets the count-in and the click, where the bar lines fall, and so how long a repeating layer lasts: repeats snap to whole bars at this tempo. It never changes the notes you played. Tap the beat along with your take and it works it out.",
    fit:"A repeating layer played at one tempo and repeated at another comes back round a little early or late, every time. This list shows each loop that does not fit the tempo now, by how much, and the tempos where it would fit exactly. Tap one to use it, or tighten the layer to the beat after changing the tempo. It reads loops whose notes come at an even pace; a free rhythm, or a loop that clearly rests at its end, is left alone.",
    playfrom:"Tap the time numbers under the picture and play starts from there instead of from the top: play, play all and this layer's play. Tap near 0s to start from the top again.",
    cursor:"The cursor is where the song's play starts and where “place at the cursor” puts a layer. Tap the numbers on the ruler (or a lane) to move it; the arrows move it a sixteenth. Drag along the numbers to mark a stretch: play then loops that stretch until you stop it. The loop button clears it.",
    snapedges:"While you drag a block, it sticks to the cursor and to the start and end of every other block when it gets close, so a layer lands exactly where another one starts or ends. Off: it moves freely in sixteenths.",
    sheet:"Sheet music, MIDI and a text score are three ways of writing down the same notes. Sheet music is for a person. MIDI is for a music app. The text score is for pasting into an AI.",
    click:"A quiet tick keeps the beat for the whole take, at the tempo above. It is never recorded. With it on you always get a count-in, even for the first layer. Turn it off if it gets in your way.",
    clickVol:"How loud the tick is in your ears. It never changes what gets recorded or exported.",

/* darken: duller from the first moment, then it keeps sinking */
function darken(node,sh,t){
  if(!(sh.dark>.02)) return node;
  const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=1.5+sh.dark*4;
  lp.frequency.setValueAtTime(Math.max(900,9000-sh.dark*7200),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(180,1800-sh.dark*1650),t+.08+(1-sh.dark)*.6);

  const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2600; bp.Q.value=.5;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18*sh.breath,t+.07);

const HARM=[7,12,4,-12];   /* fifth, octave, third, sub-octave: joining in that order as the slider rises */

function wire(out,sh){

    out.connect(g); g.connect(bus); };

/* the envelope. bite: 0 is a slow swell in (0.7s), the middle eases, 1 smacks

   fade: squared, so the middle of the slider already shortens the note clearly. */

/* touches on one note. fx = {v,s,f,b,t} each 0..1 (b is -1..1). dur in seconds.

    for(let tt=Math.max(free,t+.06); tt<t+dur-.03&&k<80; tt+=step,k++) param.setValueAtTime(at(k%2?200:0),tt); }

    const lg=ctx.createGain(), depth=cents?c:base*(Math.pow(2,c/1200)-1);

function fxGain(out,t,amp,fx,dur,atk){

/* α1.2: the touches that live between the sound and its envelope. roll and choke are a

/* α1.2 one echo: the same note again, quieter, two or three times. the copies are told

const FX_ON=["v","s","f","b","t","r","w","wa","st","sl","h","c","e"];
const fxAny=fx=>!!fx&&FX_ON.some(k=>!!fx[k]);
/* from = the note before this one in the same line: {d: semitones from it, gap: ms

/* 0.26: `when` is a time on the audio clock. play() books every note a moment
   ahead at its exact time, so a busy screen can no longer push a note late. */
function voice(id,midi,sh,fx,dur,vol,from,when){
  boot(); meterOn();
  sh=sh||shape; dur=dur||1; vol=vol==null?1:Math.max(0,Math.min(1,vol));
  const I=IN(id);
  if(packState(id)!=="ready") return fallback(id,midi,sh,fx,dur,vol,from,when);
  const hit=nearest(id,midi);
  if(!hit) return fallback(id,midi,sh,fx,dur,vol,from,when);
  const t=Math.max(ctx.currentTime,when||0), hub=ctx.createGain();
  const out=ctx.createGain(); out.gain.value=0;

    const g=ctx.createGain(); g.gain.value=gain; src.connect(g); g.connect(hub);
    fxPitch(src.playbackRate,h.rate,fx,t,dur,nodes,false,from); pitchShape(src.playbackRate,h.rate,sh,t,dur,false,from,nodes);
    nodes.push(src); src.start(t); return src; };

    for(let k=0;k<n;k++){ const h=nearest(id,midi+HARM[k]); if(!h) continue;

function release(v){
  const t=ctx.currentTime, sh=v.sh||shape;
  const tail=.04+sh.len*.9;
  try{ v.out.gain.cancelScheduledValues(t);
    v.out.gain.setValueAtTime(Math.max(v.out.gain.value,.0001),t);
    v.out.gain.exponentialRampToValueAtTime(.0006,t+tail); }catch(e){}
  v.nodes.forEach(n=>{ try{ n.stop(t+tail+.04) }catch(e){} });
}
/* let go at a booked time, without reading the gain (which is not known yet for a

function releaseAt(v,at){
  const sh=v.sh||shape, tail=.04+sh.len*.9;
  try{ v.out.gain.setTargetAtTime(.0002,at,tail/4); }catch(e){}
  v.nodes.forEach(n=>{ try{ n.stop(at+tail+.08) }catch(e){} });
}
function drum(id,sh,vol,when){
  boot(); meterOn(); sh=sh||shape; vol=vol==null?1:Math.max(0,Math.min(1,vol));
  const t=Math.max(ctx.currentTime,when||0), nodes=[];

    const n=Math.floor(ctx.sampleRate*dur), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type=ty; f.frequency.value=hz;
    const g=ctx.createGain(); g.gain.setValueAtTime(g0,t);

  else if(id==="tomH"){ tone(295,170,.22,.78); }

/* a tick that keeps the beat through the take. straight to master: not in the
   mix, not on any layer, never in a file. drift-corrected against the clock. */
function click(accent,when){
  if(!ctx) return;
  const t=Math.max(ctx.currentTime,when||0), o=ctx.createOscillator(), g=ctx.createGain();
  o.type="sine"; o.frequency.value=accent?2200:1600;
  const v=Math.max(.0006,(accent?.5:.32)*clickVol);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0005,t+.045);

/* =========================== TEMPO FROM FEEL ============================ */
/* read the tempo out of how a layer was punched: try every tempo, score how
   close the hits fall to an 8th-note grid, how many land on whole beats, and
   whether the take is a whole number of bars. mild pull toward 90-140. */
function detectTempo(l){
  const on=eventsOf(l).map(e=>e.start).sort((a,b)=>a-b); if(on.length<3) return null;
  const len=layLen(l); let best=null;
  for(let b=56;b<=190;b+=.5){ const beat=60000/b, g=beat/2; let err=0, onBeat=0;
    on.forEach(t=>{ err+=Math.abs(t-Math.round(t/g)*g)/g; if(Math.abs(t-Math.round(t/beat)*beat)<beat*.18) onBeat++; });
    err/=on.length; const bars=len/(4*beat);
    const s=err+.5*(1-onBeat/on.length)+.12*Math.abs(bars-Math.round(bars))+.002*Math.abs(b-115);
    if(!best||s<best.s) best={s,b}; }

}

    let best=e.midi, bd=99;

/* =========================== SONG ====================================== */
/* a block is one appearance of a layer at a bar. its cycle is the layer's
   whole-bar length; reps plays that cycle back to back. the layer is the
   source: nothing is copied into the block. */
const cycleMs=l=>loopBars(l)*barMs();
function songMix(){
  const out=[];
  song.forEach(b=>{ const l=layers.find(x=>x.id===b.lay); if(!l||!l.ev.length||l.mute) return;
    const ev=eventsOf(l), cyc=cycleMs(l), t0=b.bar*barMs();
    for(let k=0;k<b.reps;k++) ev.forEach(e=>out.push({...e,inst:l.inst,sh:noteSh(l,e),start:t0+k*cyc+e.start,lay:l.id,blk:b.id,vol:layVol(l)})); });
  return out;
}
const songLenBars=()=>Math.ceil(song.reduce((m,b)=>{ const l=layers.find(x=>x.id===b.lay); return l?Math.max(m,b.bar+b.reps*loopBars(l)):m; },0));
/* what "play" and "write it down" mean right now */
const useSong=()=>song.length>0&&songMix().length>0;
const activeMix=()=>useSong()?songMix():mix();

/* =========================== TRANSPORT ================================= */
function applyJoins(list){
  if(!joins.length) return list;
  const out=list.map(e=>({...e,fx:e.fx?{...e.fx}:undefined,sh:e.sh?{...e.sh}:e.sh}));
  joins.forEach(j=>{
    const A=out.filter(e=>e.lay===j.from), B=out.filter(e=>e.lay===j.to);
    if(!A.length||!B.length) return;
    const last=A.reduce((m,e)=>e.start+e.dur>m.start+m.dur?e:m);
    const first=B.reduce((m,e)=>e.start<m.start?e:m);
    if(j.kind==="hand"||j.kind==="hall"){
      last.fx={...(last.fx||{}),f:Math.max((last.fx&&last.fx.f)||0,.75)};
      first.fx={...(first.fx||{}),s:Math.max((first.fx&&first.fx.s)||0,.7)};
    }
    if(j.kind==="echo"||j.kind==="hall"){
      last.sh={...(last.sh||{}),echo:Math.max((last.sh&&last.sh.echo)||0,.55)};
      first.sh={...(first.sh||{}),room:Math.max((first.sh&&first.sh.room)||0,.5)};
    }
  });

}
/* 0.23: a note asks its layer which sound to use at the moment it fires, so a
   sound swapped while play runs is heard on the very next note (Try it as).
   half speed stretches every start and hold by 1/rate; pitch is untouched. */
function playInst(ev){ const L=ev.lay?layers.find(x=>x.id===ev.lay):null; return L?L.inst:ev.inst; }
let playGate=0;

const takeLive=()=>recording||!!(hum&&hum.live);
function play(list,isGuide,sid,mode,off){
  if(!isGuide&&takeLive()){ toast("stop the take first"); return; }
  if(playing&&!isGuide){ stop(); return; }
  if(!list.length){ toast("nothing to play yet"); return; }
  /* every layer's own sound first, so nothing plays through the stand-in */
  if(!isGuide&&layers.some(l=>IN(l.inst).sf&&(packState(l.inst)==="none"||packState(l.inst)==="loading")&&list.some(e=>e.lay===l.id))){
    const gate=++playGate; toast("getting the sounds first…");
    ensureLayers(true).then(()=>{ if(gate===playGate&&!playing) play(list,isGuide,sid,mode,off); });
    return;
  }
  list=applyJoins(list);
  boot(); if(ctx.resume) ctx.resume();
  if(!isGuide){
    playing=true; soloId=sid||null; playOrigin=performance.now()+LEAD*1000; playMode=sid?"solo":(mode||"ticked"); playOffset=off||0;
    /* 0.25: a loop stretch on the song goes round again from inside play, so it also works after a wait for sounds */
    if(playMode==="song"&&songLoop){ const lp=songLoop; clearTimeout(loopT); loopT=setTimeout(()=>{ if(playing&&playMode==="song"&&songLoop===lp){ stop(); startSong(); } },(lp.b-lp.a)*barMs()/rate); }

  if(OFF){ releaseAt(v,when+dur); return; }

/* 0.23.1: the notes play() started and has not let go of yet. stop() used to

const playVoices=new Set();

/* 0.24: play = the ticked layers of this project. play all = every layer. the song has its own play. */

  const bm=barMs(); let a=songLoop?songLoop.a:songCur, b=songLoop?songLoop.b:null;
  if(!songLoop&&a*bm>=Math.max(...all.map(e=>e.start+e.dur))){ toast("the cursor is past the end: playing from the top"); a=0; }

$("playAll").onclick=e=>{ e.stopPropagation(); playAll(); };

function playLayer(id){

function blankLayer(){
  return {id:newId(),inst:inst,sh:{...kbShape()},ev:[],loop:false,mute:false,trimIn:0,trimOut:null,vol:1,even:0,pk:true};
}
function addEmptyLayer(){
  const l=blankLayer(); layers.push(l); selL=l.id; selN=-1;
  renderStrip(); setView("layers"); paint(); save();
  toast("empty layer \u00b7 the red button records into it");
}
function startRec(){
  boot(); if(ctx.resume) ctx.resume(); allOff();
  const cur=layers.find(x=>x.id===selL);
  const target=recTarget&&layers.find(x=>x.id===recTarget);
  if(recMode==="take"&&target){
    /* a fresh take into this same layer: what it had goes on the shelf of takes */
    snap(); stashTake(target); target.ev=[]; target.trimIn=0; target.trimOut=null; target.hum=null;
    recL=target; selL=target.id;
  }else if(recMode==="over"&&target&&target.ev.length){
    snap(); recL=target; selL=target.id;
    const an=anchorLayer(), aL=an?loopStep(an):0; overStep=aL||loopStep(target); overIn=trimWindow(target).tIn; overNew=[];
  }else if(cur&&!cur.ev.length){
    recMode=null; recL=cur; recL.inst=inst;
  }else{
    recMode=null; recL=blankLayer(); layers.push(recL); selL=recL.id;
  }
  recording=true; recT0=performance.now(); selN=-1; selNs=[];
  clickStart();
  $("bRec").classList.add("live"); $("bRec").innerHTML="&#9632;";
  $("countVeil").classList.add("hidden");
  /* keep adding: the layer itself is in the guide and the loop runs on for a good while */
  const guide=recMode==="over"?mix(overStep*64,l=>PICK(l)||l.id===recL.id):mix(0,PICK).filter(e=>e.lay!==recL.id);
  if(guide.length) play(guide,true);
  recT0+=LEAD*1000;   /* 0.26: the guide and the click start LEAD later on the audio clock; the take's zero moves with them */
  renderStrip(); setView("layers");
  toast(recMode==="over"?"keep adding · stop when it is full":recMode==="take"?"recording take "+(recL.takes.length+1):"recording into this layer");
}
function stopRec(){
  recording=false; clickStop(); allOff(); stop(); recKb=false; kbFold();
  let skipped=0; const mode=recMode; recMode=null; recTarget=null;
  if(recL&&recL.ev.length&&mode!=="over"){
    const first=firstAttack(recL);
    if(first>80){ recL.trimIn=first; skipped=first; }
  }
  if(recL&&mode==="over"){ keepInside(recL,overNew); overNew=[]; }
  /* 0.23.1: another take with nothing played in it is not a take: drop it and
     go back to the one you were on */
  let dropped=false;
  if(recL&&mode==="take"&&!recL.ev.length&&recL.takes&&recL.takes.length){
    dropTake(recL,recL.take|0); switchTake(recL,recFrom); dropped=true; }
  recL=null;
  $("bRec").classList.remove("live"); $("bRec").innerHTML="&#9679;";
  renderStrip(); paint(); save();
  toast(dropped?"nothing played · back to take "+(recFrom+1):mode==="over"?"added to the layer":skipped?"layer saved \u00b7 start at "+(skipped/1000).toFixed(2)+"s":"layer saved");
}
function startOrStop(){
  if(recording){ stopRec(); return; }
  if(hum&&hum.live){ humStopRec(); return; }
  recKb=true; kbFold();   /* 0.25: the keyboard comes up for the take */
  if(!mix(0,PICK).length&&!clickOn){ startRec(); return; }   /* no click, no earlier layers: start straight away, as before */
  boot(); if(ctx.resume) ctx.resume();
  let n=0; toast("get ready");
  $("countVeil").classList.remove("hidden"); $("countNum").textContent="1";
  const tick=()=>{ if(n<4){ click(n===0); n++;
    $("countNum").textContent=String(n);
    timers.push(setTimeout(tick,Math.round(60000/(bpm*rate))-(n===4?LEAD*1000:0))); } else startRec(); };
  tick();
}
$("bRec").onclick=startOrStop;
/* what the red button is about to do, chosen from the layer's own buttons */
/* 0.23.1: another take / keep adding play and record in the layer's own sound:
   the keyboard switches to it (pads for a drum layer) and stays there after */
function armRec(mode,id){ if(recording) return; if(playing) stop(); recMode=mode; recTarget=id;
  const L=layers.find(x=>x.id===id);
  if(L&&L.inst!==inst){ allOff(); inst=L.inst; octave=IN(inst).o; buildKB(); showNote((octave+1)*12,inst==="drums"?"kick":null); ensure(inst,true); }
  recFrom=L?(L.take|0):0;

let recFrom=0;
/* =========================== TAKES ====================================== */
/* a layer keeps every take. l.takes holds the ones you are not hearing, in
   order of birth; l.take is the number of the live one. switching swaps the
   notes, the trim and the hum in and out; the shape and the sound stay. */
/* 0.23.1: the take you are on goes back into its own place among the others and
   the new one is born at the end. it used to be pushed to the end, so after
   switching back to take 1 and recording again, take 1 became take 2. */
function stashTake(l){
  l.takes=allTakes(l).map(x=>({ev:x.ev,ti:x.ti,to:x.to,hum:x.hum||null}));
  l.take=l.takes.length;
}
function allTakes(l){ const all=(l.takes||[]).slice(); all.splice(l.take|0,0,{ev:l.ev,ti:l.trimIn||0,to:l.trimOut==null?null:l.trimOut,hum:l.hum||null,live:true}); return all; }
function setTakes(l,all,k){ const t=all[k]; l.ev=t.ev; l.trimIn=t.ti; l.trimOut=t.to; l.hum=t.hum||null;
  l.takes=all.filter((x,i)=>i!==k).map(x=>({ev:x.ev,ti:x.ti,to:x.to,hum:x.hum||null})); l.take=k; selN=-1; selNs=[]; }
function switchTake(l,k){ const all=allTakes(l); if(k<0||k>=all.length||k===(l.take|0)) return; setTakes(l,all,k); }
function dropTake(l,k){ const all=allTakes(l); if(all.length<2||k<0||k>=all.length) return;
  all.splice(k,1); const cur=l.take|0, nk=k<cur?cur-1:k===cur?Math.min(cur,all.length-1):cur; setTakes(l,all,nk); }
function takeChips(l){
  if(!l.takes||!l.takes.length) return '';
  const all=allTakes(l), cur=l.take|0;
  return '<div class="lbl mh" style="display:flex;align-items:center;gap:6px"><span style="flex:1">Takes</span><button class="qm" data-help="takes" aria-label="What takes are">?</button></div><div class="takes">'+
    all.map((t,k)=>'<button class="btn sm'+(k===cur?" on":"")+'" data-take="'+k+'">take '+(k+1)+' \u00b7 '+t.ev.length+(t.hum?' \u00b7 hum':'')+'</button>').join("")+
    '<button class="btn sm dan" data-droptake="'+cur+'">drop this take</button></div>';
}

/* =========================== HUM IT FIRST =============================== */
/* the mic records a hum. two things come out of it: the hum itself, kept on
   this device as a memo (never in the mix, never in a file), and the notes it
   heard, on the nearest key, in a new layer. he WILL be off: fit to key and
   the up/down steps are the second half of this feature. */
const HUM_SR=16000, HUMS={};
let humSrc=null;
function openHum(){
  if(recording||(hum&&hum.live)) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ toast("this browser has no microphone for web pages"); return; }
  hum={live:false,chunks:[],n:0,others:false,lvl:0};
  sheet('<h2>Hum it first</h2>'+
    '<p>Hum, whistle or sing the line. It lands in a new layer as notes, and the hum itself is kept so you can check against it. Being off is fine: <b style="color:var(--blue)">fit to key</b> on the layer fixes most of it, the up and down steps fix the rest.</p>'+
    '<div class="row" style="margin-bottom:6px"><button class="btn sm" data-hum="others">play the other layers while I hum: off</button>'+
    '<button class="qm" data-help="hum" aria-label="What hum it first does">?</button></div>'+
    '<p class="note">With the others on, use headphones, or the mic hears them too and they end up in the notes. The click stays on either way if it is on in Settings.</p>'+
    '<div class="humlvl"><i id="humLvl"></i></div>'+
    '<button class="big rec" data-hum="go" id="humGo">start humming</button>'+
    '<button class="big ghost" data-close>Cancel</button>');
}
$("sheetIn").addEventListener("click",e=>{
  const b=e.target.closest("[data-hum]"); if(!b||!hum) return;
  const a=b.dataset.hum;
  if(a==="others"){ hum.others=!hum.others; b.textContent="play the other layers while I hum: "+(hum.others?"on":"off"); b.classList.toggle("on",hum.others); return; }
  if(a==="go"){ if(hum.live) humStopRec(); else humStartRec(); }
});
function humStartRec(){
  boot(); if(ctx.resume) ctx.resume(); allOff(); if(playing) stop();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(stream=>{
    if(!hum){ stream.getTracks().forEach(t=>t.stop()); return; }
    const src=ctx.createMediaStreamSource(stream);
    const proc=ctx.createScriptProcessor(4096,1,1), mute=ctx.createGain(); mute.gain.value=0;
    hum.stream=stream; hum.src=src; hum.proc=proc; hum.mute=mute; hum.sr=ctx.sampleRate; hum.chunks=[]; hum.n=0;
    proc.onaudioprocess=ev=>{ if(!hum||!hum.live) return; const d=ev.inputBuffer.getChannelData(0);
      hum.chunks.push(new Float32Array(d)); hum.n+=d.length;
      let s=0; for(let i=0;i<d.length;i+=4) s+=d[i]*d[i]; hum.lvl=Math.sqrt(s/(d.length/4)); };
    src.connect(proc); proc.connect(mute); mute.connect(master);
    hum.live=true; hum.t0=performance.now();
    const g=$("humGo"); if(g){ g.textContent="stop · I have it"; g.classList.add("live"); }
    $("bRec").classList.add("live"); $("bRec").innerHTML="&#9632;";
    clickStart();
    if(hum.others){ const guide=mix(0,PICK); if(guide.length) play(guide,true); }
    const tick=()=>{ if(!hum||!hum.live) return; const el=$("humLvl"); if(el) el.style.width=Math.min(100,Math.round(hum.lvl*420))+"%"; requestAnimationFrame(tick); };
    tick();
    toast("humming… tap stop when you have it");
  }).catch(()=>{ toast("no microphone: allow it in the browser and try again"); });
}
function humStopRec(){
  if(!hum||!hum.live) return;
  hum.live=false; clickStop(); stop();
  try{ hum.src.disconnect(); hum.proc.disconnect(); hum.mute.disconnect(); }catch(e){}
  try{ hum.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  $("bRec").classList.remove("live"); $("bRec").innerHTML="&#9679;";
  const g=$("humGo"); if(g){ g.textContent="listening…"; g.classList.remove("live"); }
  const h=hum; hum=null;
  setTimeout(()=>{ try{ humFinish(h); }catch(e){ toast("could not read the hum"); closeSheet(); } },30);
}
/* 48k (or whatever the phone runs at) down to 16k mono, then YIN per 20ms */
function humFinish(h){
  const total=h.n; if(total<h.sr*.3){ toast("too short to hear anything"); closeSheet(); return; }
  const all=new Float32Array(total); let o=0; h.chunks.forEach(c=>{ all.set(c,o); o+=c.length; });
  const ratio=h.sr/HUM_SR, n=Math.floor(total/ratio), pcm=new Float32Array(n);
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), b=Math.min(total,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=all[j]; pcm[i]=s/Math.max(1,b-a); }
  const notes=humNotes(pcm,HUM_SR);
  const id=(inst==="drums")?"ooh":inst;
  const l=blankLayer(); l.inst=id; l.sh=cloneSh(shape);
  l.ev=notes.map(x=>({midi:x.midi,pad:null,start:x.start,dur:x.dur}));
  l.hum={k:newId(),sr:HUM_SR,n:n};
  layers.push(l); selL=l.id; selN=-1; selNs=[];
  if(l.ev.length){ const first=firstAttack(l); if(first>80) l.trimIn=first; }
  /* keep the hum: in memory now, on the shelf for next time */
  const buf=ctx.createBuffer(1,n,HUM_SR); buf.getChannelData(0).set(pcm); HUMS[l.hum.k]=buf;
  const i16=new Int16Array(n); for(let i=0;i<n;i++) i16[i]=Math.max(-32768,Math.min(32767,Math.round(pcm[i]*32767)));
  kvPut("hums",l.hum.k,{sr:HUM_SR,pcm:i16.buffer,t:Date.now()});
  closeSheet(); ensure(id,true); renderStrip(); setView("layers"); paint(); save(); markFitKeys();
  toast(l.ev.length?l.ev.length+(l.ev.length===1?" note heard":" notes heard")+" · fit to key if it is off":"nothing with pitch heard: the hum is kept");
}
/* pitch per frame: YIN, cumulative mean normalised difference, threshold .15,
   70..1000 Hz. then frames become notes: same pitch held = one note. */
function humNotes(x,sr){
  const W=1024, HOP=Math.round(sr*.02), tMin=Math.floor(sr/1000), tMax=Math.ceil(sr/70);
  const frames=[]; const d=new Float32Array(tMax+1), c=new Float32Array(tMax+1);
  let rmsMax=0;
  for(let p=0;p+W+tMax<x.length;p+=HOP){
    let e=0; for(let i=0;i<W;i++) e+=x[p+i]*x[p+i]; const rms=Math.sqrt(e/W); if(rms>rmsMax) rmsMax=rms;
    let f0=null, conf=1;
    if(rms>.004){
      d[0]=0; for(let t=1;t<=tMax;t++){ let s=0; for(let i=0;i<W;i++){ const v=x[p+i]-x[p+i+t]; s+=v*v; } d[t]=s; }
      c[0]=1; let run=0; for(let t=1;t<=tMax;t++){ run+=d[t]; c[t]=run>0?d[t]*t/run:1; }
      let tau=-1; for(let t=tMin;t<=tMax;t++){ if(c[t]<.15){ while(t+1<=tMax&&c[t+1]<c[t]) t++; tau=t; break; } }
      if(tau<0){ let bt=tMin, bv=9; for(let t=tMin;t<=tMax;t++) if(c[t]<bv){ bv=c[t]; bt=t; } if(bv<.35) tau=bt; }
      if(tau>0){ const a=c[tau-1]||c[tau], b=c[tau], cc=c[tau+1]||c[tau], den=a-2*b+cc; const sh=den?(a-cc)/(2*den):0;
        f0=sr/(tau+sh); conf=b; }
    }
    frames.push({t:p*1000/sr,rms,f0,conf});
  }
  const thr=Math.max(.006,rmsMax*.12);
  const midi=frames.map(f=>(f.f0&&f.rms>thr&&f.conf<.3)?69+12*Math.log2(f.f0/440):null);
  /* a short median to calm the flicker, then runs of one pitch */
  const sm=midi.map((m,i)=>{ if(m==null) return null; const w=[]; for(let k=-2;k<=2;k++){ const v=midi[i+k]; if(v!=null) w.push(v); }
    w.sort((a,b)=>a-b); return w[w.length>>1]; });
  const out=[]; let cur=null;
  const close=(endT)=>{ if(!cur) return; const ms=cur.ms.slice().sort((a,b)=>a-b), m=Math.round(ms[ms.length>>1]);
    const dur=endT-cur.t; if(dur>=90) out.push({midi:clampM(m),start:Math.round(cur.t),dur:Math.round(dur)}); cur=null; };
  let gap=0;
  sm.forEach((m,i)=>{ const t=frames[i].t;
    if(m==null){ gap++; if(cur&&gap>=2) close(frames[i-gap+1].t); return; }
    gap=0;
    if(cur){ const ref=cur.ms.slice().sort((a,b)=>a-b)[cur.ms.length>>1]; if(Math.abs(m-ref)>=.75){ close(t); } }
    if(!cur) cur={t,ms:[m]}; else cur.ms.push(m); });
  if(cur) close(frames[frames.length-1].t+20);
  /* same note twice with a hair between: one note */
  const merged=[]; out.forEach(n=>{ const p=merged[merged.length-1];
    if(p&&p.midi===n.midi&&n.start-(p.start+p.dur)<60){ p.dur=n.start+n.dur-p.start; } else merged.push(n); });
  return merged;
}
function humBuffer(l){
  if(!l.hum||!l.hum.k) return Promise.resolve(null);
  if(HUMS[l.hum.k]) return Promise.resolve(HUMS[l.hum.k]);
  return kvGet("hums",l.hum.k).then(v=>{ if(!v||!v.pcm) return null;
    const i16=new Int16Array(v.pcm), buf=ctx.createBuffer(1,i16.length,v.sr||HUM_SR), ch=buf.getChannelData(0);
    for(let i=0;i<i16.length;i++) ch[i]=i16[i]/32767; HUMS[l.hum.k]=buf; return buf; });
}
function humHear(l){
  boot(); if(ctx.resume) ctx.resume(); if(playing) stop();
  humBuffer(l).then(buf=>{ if(!buf){ toast("the hum is not on this device"); return; }
    humStop(); const s=ctx.createBufferSource(); s.buffer=buf; const g=ctx.createGain(); g.gain.value=1.4;
    s.connect(g); g.connect(master); const off=(l.trimIn||0)/1000; s.start(0,Math.min(off,Math.max(0,buf.duration-.05))); humSrc=s; meterOn();
    s.onended=()=>{ if(humSrc===s) humSrc=null; }; toast("your hum"); });
}
function humStop(){ if(humSrc){ try{ humSrc.stop(); }catch(e){} humSrc=null; } }
/* cancel: the sheet went away mid-hum. nothing is kept. */
function humCancel(){
  if(!hum) return;
  if(hum.live){ hum.live=false; clickStop(); stop();
    try{ hum.src.disconnect(); hum.proc.disconnect(); hum.mute.disconnect(); }catch(e){}
    try{ hum.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    $("bRec").classList.remove("live"); $("bRec").innerHTML="&#9679;"; toast("hum dropped"); }
  hum=null;
}
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") humCancel(); });
$("sheetIn").addEventListener("click",e=>{ if(e.target.closest("[data-close]")) humCancel(); });

document.querySelectorAll('.zhead').forEach(h=>h.addEventListener("click",e=>{
  if(e.target.closest("button")&&!e.target.closest(".chev")) return;
  const z=h.dataset.z;
  /* 0.25: in a tool view the keyboard is folded; its strip opens and closes it */
  if(z==="Kb"&&foldViews(view)){ kbOpen=!kbOpen; if(kbOpen&&collapsed.Kb){ collapsed.Kb=false; applyCollapse(); } kbFold(); return; }
  collapsed[z]=!collapsed[z]; applyCollapse();

/* 0.25: the tools get the screen. in Layers, Shape and Notes the keyboard is a
   strip until you open it; the red button opens it for the take on its own. */
function foldViews(v){ return !isDesk()&&(v==="layers"||v==="shape"||v==="notes"); }
function kbFold(){
  const f=foldViews(view)&&!kbOpen&&!recKb;

  const c=document.querySelector('.chev[data-z="Kb"]'); if(c) c.innerHTML=(f||collapsed.Kb)?"&#9656;":"&#9662;";
  if(was&&!f) setTimeout(buildKB,30);
}

/* =========================== SHEETS ==================================== */

  const m=/^<h2>([^<]*)<\/h2>/.exec(html);
  if(m){ const t=m[1].replace(/&amp;/g,"&");
    html='<h2 class="cut">'+cut(t,13)+'</h2><div class="prm" aria-hidden="true"><b>&gt;</b> '+esc(t.toLowerCase())+'<i class="cur"></i></div>'+html.slice(m[0].length); }
  $("sheetIn").innerHTML='<i class="pins" aria-hidden="true"></i>'+bandHtml(2)+'<div class="sheet-w">'+html+'</div>';
  $("sheet").classList.remove("hidden"); lightFaders($("sheetIn"));
}
function closeSheet(){ $("sheet").classList.add("hidden"); }
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });

function setLayerSound(l,id){
  if(l.inst===id) return true;
  if(l.inst==="drums"||id==="drums"){ toast(l.inst==="drums"?"drums are a kit: duplicate the layer and record the other sound":"a played layer cannot become drums"); return false; }
  l.inst=id; ensure(id); renderStrip(); if(view==="layers"||view==="shape") paint(); save(); return true;
}
$("sheetIn").addEventListener("click",e=>{
  const tr=e.target.closest("[data-try]");
  if(tr){ const L=layers.find(x=>x.id===soundFor); if(!L) return;
    if(tr.dataset.try==="play"){ if(playing) stop(); else { play(mix(0,l=>PICK(l)||l.id===soundFor),false,null,"ticked");
        const b=$("tryPlay"); if(b&&playing){ b.classList.add("on"); b.textContent="stop"; } } return; }
    if(tr.dataset.try==="back"){ if(soundWas&&setLayerSound(L,soundWas)) openSound(L.id); return; } }
  const i=e.target.closest("[data-ins]");
  if(i){ const id=i.dataset.ins;
    if(soundFor){ const L=layers.find(x=>x.id===soundFor); if(!L){ closeSheet(); return; }
      if(!setLayerSound(L,id)) return;
      $("sheetIn").querySelectorAll("[data-ins]").forEach(b=>{ const on=b.dataset.ins===id; b.classList.toggle("on",on);
        b.style.boxShadow=on?"0 0 0 1.5px "+IN(id).c+",0 0 12px var(--shine)":""; });
      if(!playing){ const ev=eventsOf(L).slice(0,6); if(ev.length){ boot(); if(ctx.resume) ctx.resume();
        ensure(id,true).then(()=>{ if(!playing&&soundFor===L.id) play(ev.map(x=>({...x,inst:id,sh:noteSh(L,x),lay:L.id,vol:layVol(L)})),false,L.id); }); } }
      return; }
    allOff(); inst=id; octave=IN(inst).o;
    buildKB(); showNote((octave+1)*12,inst==="drums"?"kick":null);
    closeSheet(); ensure(inst); return; }
  if(e.target.closest("[data-loadall]")){ closeSheet(); loadAll(); return; }
});
$("bSound").onclick=()=>openSound(null);
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") soundFor=null; });
$("sheetIn").addEventListener("click",e=>{ if(e.target.closest("[data-close]")) soundFor=null; });

/* pitch finder */
function openFind(){
  boot(); if(ctx.resume) ctx.resume();
  const l=layers.find(x=>x.id===selL), id=(l?l.inst:inst);
  if(id==="drums"){ toast("drums have no pitch"); return; }
  pf={id,midi:(octave+1)*12,j:2,dir:0};
  sheet('<h2>Find the note by ear</h2><div id="pfN">&mdash;</div><div id="pfS"></div>'+
    '<div class="half" style="margin-top:14px">'+
    '<button class="pfb" data-pf="dn">&#9660; lower</button>'+
    '<button class="pfb" data-pf="up">&#9650; higher</button></div>'+
    '<div class="row" style="margin-top:6px">'+
    '<button class="btn sm" data-pf="again">hear it again</button>'+
    '<button class="btn sm" data-pf="jump" id="pfJ">big steps</button></div>'+
    '<p>Tap higher or lower until it matches what you hear. It closes in on its own.</p>'+
    '<button class="big" data-pf="ok">That is the one</button>'+
    '<button class="big ghost" data-close>Cancel</button>');
  drawPF(); playPF();
}
function drawPF(){
  if(!pf||!$("pfN")) return;
  $("pfN").textContent=mName(pf.midi);
  $("pfS").textContent=IN(pf.id).n+" \u00b7 "+Math.round(mFreq(pf.midi))+" hz";
  const j=DB.JUMPS[pf.j];
  $("pfJ").textContent=j>=7?"big steps":j>=3?"small steps":"tiny steps";
}
function playPF(){ if(!pf) return; hear(voice(pf.id,pf.midi,{...DB.SHAPE0,len:.4}),700); }
$("sheetIn").addEventListener("click",e=>{
  const b=e.target.closest("[data-pf]"); if(!b||!pf) return;
  const a=b.dataset.pf;
  if(a==="again"){ playPF(); return; }
  if(a==="jump"){ pf.j=(pf.j+1)%DB.JUMPS.length; drawPF(); return; }
  if(a==="ok"){ const m=pf.midi;
    octave=Math.min(DB.OCT_MAX,Math.max(DB.OCT_MIN,Math.floor(m/12)-1));
    buildKB(); showNote(m,null); closeSheet();
    toast("that note is "+mName(m)); pf=null; return; }
  const dir=a==="up"?1:-1;
  if(pf.dir&&dir!==pf.dir&&pf.j<DB.JUMPS.length-1) pf.j++;
  pf.dir=dir; pf.midi=clampM(pf.midi+dir*DB.JUMPS[pf.j]);
  drawPF(); playPF();
});
$("bFind").onclick=openFind;

/* =========================== PACK LOADING ============================== */
function ensure(id,quiet){
  const I=IN(id);
  if(!I||!I.sf) return Promise.resolve(false);
  if(packState(id)==="ready") return Promise.resolve(true);
  if(packState(id)==="failed"){ if(!quiet) toast(I.n+" could not download, using a rough stand-in"); return Promise.resolve(false); }
  $("nSub").textContent="getting "+I.n.toLowerCase()+"\u2026";
  return loadPack(id,r=>{ if(r.state==="loading"&&r.total)
      $("nSub").textContent="getting "+I.n.toLowerCase()+" "+Math.round(r.n/r.total*100)+"%"; })
    .then(ok=>{ $("nSub").textContent=IN(inst).n; if(id===inst) markRange();
      if(!quiet) toast(ok?I.n.toLowerCase()+" ready":I.n.toLowerCase()+" failed, rough stand-in for now");
      return ok; });
}
/* download all = put every sound on the shelf. nothing is decoded here: a
   sound is decoded the first time a layer or the keyboard needs it. one at a
   time, with a running count in the readout, and the view stays where it is. */
let loadingAll=false;
function loadAll(){
  if(loadingAll){ toast("already downloading"); return; }
  const ids=DB.IDS.filter(i=>IN(i).sf&&!packKept(i)&&packState(i)!=="ready");
  if(!ids.length){ toast("every sound is already on this device"); return; }
  let i=0, failed=0; loadingAll=true; toast("keeping "+ids.length+" sounds on this device");
  const sub=$("nSub");
  const next=()=>{ if(i>=ids.length){ loadingAll=false; sub.textContent=IN(inst).n;
      toast(failed?"done · "+failed+" could not be fetched, they will try again later":"all "+DB.IDS.filter(x=>IN(x).sf).length+" sounds are on this device"); return; }
    const id=ids[i++], I=IN(id); sub.textContent="keeping "+I.n.toLowerCase()+" · "+i+" of "+ids.length;
    fetchRaw(I,p=>{ sub.textContent="keeping "+I.n.toLowerCase()+" "+Math.round(p.n/p.total*100)+"% · "+i+" of "+ids.length; })
      .then(raw=>{ if(!raw) failed++; next(); }); };
  next();
}

/* =========================== SAVE / SHARE ============================== */
function packEv(ev){
  return ev.map(e=>{ const a=[e.pad?DB.PADS.findIndex(p=>p.id===e.pad):e.midi,e.start,e.dur,e.pad?1:0];
    const hasSh=e.sh&&typeof e.sh==="object", hasRd=e.rawDur!=null&&Math.round(e.rawDur)!==e.dur;
    if(fxAny(e.fx)) a.push(packFx(e.fx));
    else if(hasSh||hasRd) a.push(null);
    if(hasSh) a.push(e.sh); else if(hasRd) a.push(null);
    if(hasRd) a.push(Math.round(e.rawDur)); return a; });
}
const packHum=h=>h&&h.k?{k:h.k,sr:h.sr||HUM_SR,n:h.n|0}:undefined;
/* 0.24: a project is {layers, song, bpm, anchorId, joins, notepad}: the live one is the globals */
function liveState(){ return {layers,song,bpm,anchorId,joins,notepad}; }
function allLayers(){ return projects.flatMap((p,i)=>i===projIdx?layers:((p.data&&p.data.layers)||[])); }
function projPack(st){
  return {notes:st.notepad||"",anchor:st.anchorId,bpm:st.bpm,
    layers:st.layers.map(l=>({i:l.inst,l:l.loop?1:0,m:l.mute?1:0,id:l.id,s:l.sh,g:Math.round(layVol(l)*100)/100,
      evn:Math.round((l.even||0)*100)/100, ho:l.holdMs||0,
      ti:l.trimIn||0, to:l.trimOut==null?-1:l.trimOut,
      e:packEv(l.ev),
      hm:packHum(l.hum), tk:(l.takes&&l.takes.length)?l.takes.map(t=>({e:packEv(t.ev),ti:t.ti||0,to:t.to==null?-1:t.to,hm:packHum(t.hum)})):undefined,
      tn:(l.takes&&l.takes.length)?(l.take|0):undefined, pk:l.pk===false?0:undefined})),
    song:st.song.map(b=>[b.lay,b.bar,b.reps]),
    joins:st.joins.map(j=>[j.from,j.to,j.kind])};
}
function pack(){
  const pj=projects.map((p,i)=>({nm:p.name,...projPack(i===projIdx?liveState():p.data)}));
  const o={v:10,name:fragName,shape:shape,pi:projIdx,pj};
  return DB.code+"|"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function unpack(code){
  const s=String(code||"").trim();
  const bar=s.indexOf("|"), tag=bar>0?s.slice(0,bar):s.slice(0,4);
  if(DB.code!==tag&&!DB.oldCodes.includes(tag)) throw new Error("not a Scribe code");
  if(tag==="SCR1"){
    const p=s.split("|"), out=[];
    (p[2]||"").split(";").filter(Boolean).forEach(r=>{
      const f=r.split(",").map(Number); if(f.length<5||f.some(isNaN)) return;
      const id=fixId(DB.V1_IDS[f[0]]); if(!id) return;
      out.push({inst:id,midi:id==="drums"?padAt(f[1]).m:clampM(f[1]),
        pad:id==="drums"?padAt(f[1]).id:null,start:Math.max(0,f[2]|0),dur:Math.max(40,f[3]|0)}); });
    return {name:"imported",shape:{...DB.SHAPE0},pi:0,projects:[{name:"Project 1",st:{notepad:"",anchorId:null,bpm:DB.BPM0,song:[],joins:[],
      layers:out.length?[{id:newId(),inst:out[0].inst,sh:{...DB.SHAPE0},loop:false,mute:false,
        trimIn:0,trimOut:null,pk:true,
        ev:out.map(e=>({midi:e.midi,pad:e.pad,start:e.start,dur:e.dur}))}]:[]}}]};
  }
  const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(bar+1)))));
  const legacy=tag==="SCR2"?DB.V1_IDS:tag==="SCR3"?DB.V4_IDS:tag==="SCR4"?DB.V5_IDS:null;
  const shp={...DB.SHAPE0,...(o.shape&&typeof o.shape==="object"?o.shape:{})};
  if(Array.isArray(o.pj)&&o.pj.length){
    const pj=o.pj.slice(0,24).map((p,i)=>({name:String(p.nm||("Project "+(i+1))).slice(0,40),st:readState(p,null)}));
    return {name:String(o.name||"sketch").slice(0,60),shape:shp,projects:pj,pi:Math.max(0,Math.min(pj.length-1,o.pi|0))};
  }
  return {name:String(o.name||"sketch").slice(0,60),shape:shp,projects:[{name:"Project 1",st:readState(o,legacy)}],pi:0};
}
function readState(o,legacy){
  const L=[];
  const readEv=(e,id)=>(e||[]).slice(0,4000).map(f=>({
        midi:f[3]||id==="drums"?padAt(f[0]).m:clampM(f[0]),
        pad:(f[3]||id==="drums")?padAt(f[0]).id:null,
        start:Math.max(0,f[1]|0),dur:Math.max(40,f[2]|0),
        fx:Array.isArray(f[4])?readFx(f[4]):undefined,
        sh:f[5]&&typeof f[5]==="object"&&!Array.isArray(f[5])?{...DB.SHAPE0,...f[5]}:undefined,
        rawDur:typeof f[6]==="number"&&f[6]>=40?Math.round(f[6]):undefined}));
  const readHum=h=>(h&&typeof h==="object"&&typeof h.k==="string")?{k:h.k.slice(0,24),sr:+h.sr||HUM_SR,n:h.n|0}:null;
  (o.layers||[]).slice(0,32).forEach(l=>{
    const id=fixId(l.i);
    const takes=(Array.isArray(l.tk)?l.tk:[]).slice(0,16).map(t=>({ev:readEv(t.e,id),ti:Math.max(0,t.ti||0),to:(typeof t.to==="number"&&t.to>=0)?t.to:null,hum:readHum(t.hm)}));
    L.push({id:typeof l.id==="string"?l.id.slice(0,24):newId(),inst:id,
      sh:{...DB.SHAPE0,...(l.s&&typeof l.s==="object"?l.s:{})},
      loop:!!l.l,mute:!!l.m,vol:l.g==null?1:Math.max(0,Math.min(1,+l.g||0)),
      even:l.evn==null?0:Math.max(0,Math.min(1,+l.evn||0)),
      holdMs:l.ho>0?Math.max(80,Math.min(1600,+l.ho)):undefined,
      trimIn:Math.max(0,l.ti||0),
      trimOut:(typeof l.to==="number"&&l.to>=0)?l.to:null,
      ev:readEv(l.e,id),
      hum:readHum(l.hm),
      takes:takes.length?takes:undefined,
      take:takes.length?Math.max(0,Math.min(takes.length,l.tn|0)):0, pk:l.pk!==0});
  });
  (o.takes||[]).slice(0,32).forEach(t=>{
    const id=fixId(t.i);
    L.push({id:newId(),inst:id,sh:{...DB.SHAPE0},loop:!!t.l,mute:!!t.m,trimIn:0,trimOut:null,pk:true,
      ev:(t.e||[]).slice(0,4000).map(f=>({
        midi:id==="drums"?padAt(f[0]).m:clampM(f[0]),
        pad:id==="drums"?padAt(f[0]).id:null,
        start:Math.max(0,f[1]|0),dur:Math.max(40,f[2]|0)}))});
  });
  if(o.free&&o.free.length&&legacy){
    const g={};
    o.free.forEach(f=>{ const id=fixId(legacy[f[0]]||"piano"); (g[id]=g[id]||[]).push(f); });
    Object.keys(g).forEach(id=>L.push({id:newId(),inst:id,sh:{...DB.SHAPE0},loop:false,mute:false,trimIn:0,trimOut:null,pk:true,
      ev:g[id].map(f=>({midi:id==="drums"?padAt(f[1]).m:clampM(f[1]),
        pad:id==="drums"?padAt(f[1]).id:null,start:Math.max(0,f[2]|0),dur:Math.max(40,f[3]|0)}))}));
  }
  return {notepad:String(o.notes||"").slice(0,8000),
    anchorId:typeof o.anchor==="string"?o.anchor.slice(0,24):null,layers:L,
    bpm:clampBpm(o.bpm),song:readSong(o.song,L),joins:readJoins(o.joins,L)};
}
function readJoins(raw,L){
  const ids=new Set(L.map(l=>l.id)), out=[], kinds={hand:1,echo:1,hall:1};
  (Array.isArray(raw)?raw:[]).forEach(j=>{
    if(!Array.isArray(j)||!ids.has(j[0])||!ids.has(j[1])||j[0]===j[1]||!kinds[j[2]]) return;
    out.push({from:j[0],to:j[1],kind:j[2]});
  });
  return out;
}
function readSong(raw,L){ const S=[], ids=new Set(L.map(l=>l.id));
  (Array.isArray(raw)?raw:[]).slice(0,400).forEach(b=>{ if(!Array.isArray(b)||!ids.has(b[0])) return;
    S.push({id:newId(),lay:b[0],bar:snap16(+b[1]||0),reps:Math.max(1,Math.min(64,b[2]|0||1))}); });
  return S; }
const c01=x=>Math.max(0,Math.min(1,+x||0));
/* SCR11: the fx array is 18 numbers. the first six are SCR8's, the rest are α1.2's
   touches; an old code stops at six and reads the same as before. */
const FX_ORDER=["v","s","f","b","t","vr","r","rr","rb","rg","w","wr","wa","st","sl","h","c","e"];
function packFx(fx){ const a=FX_ORDER.map(k=>k==="t"||k==="r"||k==="h"?(fx[k]?1:0):k==="vr"?(fx.vr==null?.5:fx.vr):(fx[k]||0)).map(x=>Math.round(x*100)/100);
  let n=a.length; while(n>6&&!a[n-1]) n--; return a.slice(0,n); }
function readFx(a){ const fx={v:c01(a[0]),s:c01(a[1]),f:c01(a[2]),b:Math.max(-1,Math.min(1,+a[3]||0)),t:a[4]?1:0,vr:a[5]==null?.5:c01(a[5])};
  FX_ORDER.slice(6).forEach((k,i)=>{ const x=a[6+i]; if(x==null) return; fx[k]=(k==="r"||k==="h")?(x?1:0):c01(x); });
  return fxAny(fx)?fx:undefined; }
const clampBpm=v=>{ v=Math.round(+v); return isFinite(v)&&v>0?Math.min(DB.BPM_MAX,Math.max(DB.BPM_MIN,v)):DB.BPM0; };
function adopt(o,label){
  if(playing) stop();
  fragName=o.name; shape=o.shape;
  projects=o.projects.map(p=>({id:newId(),name:p.name,data:p.st}));
  loadProj(o.pi);
  renderStrip(); paint(); save(); markFitKeys();
  /* every layer's own sound, straight away, from the shelf when it is there */
  if(layers.length) ensureLayers(true);
  toast((label||"loaded")+" \u00b7 "+(projects.length>1?projects.length+" projects \u00b7 ":"")+layers.length+" layers");
}
/* =========================== PROJECTS (0.24) =========================== */
function loadProj(i){
  const d=projects[i].data||{layers:[],song:[],bpm:DB.BPM0,anchorId:null,joins:[],notepad:""};
  layers=d.layers||[]; song=d.song||[]; bpm=d.bpm||DB.BPM0; anchorId=d.anchorId||null; joins=d.joins||[]; notepad=d.notepad||"";
  projects[i].data=null; projIdx=i; mainFrom=0; songCur=0; songLoop=null; selLane=null;
  selL=layers.length?layers[0].id:null; selB=null; selN=-1; selNs=[]; hist=[]; future=[];
}
function afterProj(label){ renderStrip(); paint(); save(); markFitKeys(); if(layers.length) ensureLayers(true); if(label) toast(label); }
function switchProject(i){
  if(i===projIdx||!projects[i]) return;
  if(takeLive()){ toast("stop the take first"); return; }
  if(playing) stop();
  projects[projIdx].data=liveState(); loadProj(i); afterProj(projects[i].name+" \u00b7 "+layers.length+(layers.length===1?" layer":" layers"));
}
function newProject(){
  if(takeLive()){ toast("stop the take first"); return; }
  if(playing) stop();
  projects[projIdx].data=liveState();
  projects.push({id:newId(),name:"Project "+(projects.length+1),data:{layers:[],song:[],bpm:bpm,anchorId:null,joins:[],notepad:""}});
  loadProj(projects.length-1); afterProj("new project");
}
function moveLayerTo(l,i){
  if(takeLive()){ toast("stop the take first"); return; }
  if(i==="new"){ projects.push({id:newId(),name:"Project "+(projects.length+1),data:{layers:[],song:[],bpm:bpm,anchorId:null,joins:[],notepad:""}}); i=projects.length-1; }
  if(i===projIdx||!projects[i]||!projects[i].data) return;
  if(playing) stop();
  layers=layers.filter(x=>x!==l); song=song.filter(b=>b.lay!==l.id); joins=joins.filter(j=>j.from!==l.id&&j.to!==l.id);
  if(anchorId===l.id) anchorId=null;
  const d=projects[i].data; l.pk=true; d.layers.push(l);
  selL=layers.length?layers[0].id:null; selN=-1; selNs=[]; hist=[]; future=[]; if(selLane===l.id) selLane=null;
  renderStrip(); paint(); save(); markFitKeys(); toast("moved to "+projects[i].name);
  if(!$("sheet").classList.contains("hidden")&&$("sheetIn").querySelector("[data-pj]")) openProjects();
}
function openProjects(){
  sheet('<h2>Projects</h2><p class="note">Each project keeps its own layers, song and tempo. Play and the red button work inside the one you are in. <button class="qm" data-help="proj" aria-label="What projects are">?</button></p>'+
    projects.map((p,i)=>{ const n=i===projIdx?layers.length:((p.data&&p.data.layers)||[]).length;
      return '<div class="slot"><span class="sn">'+esc(p.name)+'<br><span class="lbl">'+n+(n===1?' layer':' layers')+(i===projIdx?' \u00b7 open now':'')+'</span></span>'+
        (i===projIdx?'':'<button class="mini" data-proj="'+i+'">open</button>')+'</div>'; }).join("")+
    (()=>{ const l=layers.find(x=>x.id===selL); if(!l) return '';
      return '<div class="lbl mh" style="margin-top:12px">Move '+esc(laneName(l))+' to</div><div class="row">'+
        projects.map((p,i)=>i===projIdx?'':'<button class="btn sm" data-movep2="'+i+'">'+esc(p.name)+'</button>').join('')+
        '<button class="btn sm zap" data-movep2="new">+ new project</button></div>'; })()+
    '<div class="grid2" style="margin-top:10px"><button class="btn sm go" data-pj="new">New project</button><button class="btn sm" data-pj="rename">Rename this one</button></div>'+
    '<div class="grid2" style="margin-top:6px"><button class="btn sm" data-pj="copy">Copy this one</button><button class="btn sm dan" data-pj="del">Delete this one</button></div>'+
    '<button class="big ghost" data-close>Close</button>');
}
$("sheetIn").addEventListener("click",e=>{
  const m2=e.target.closest("[data-movep2]");
  if(m2){ const l=layers.find(x=>x.id===selL); if(l) moveLayerTo(l,m2.dataset.movep2==="new"?"new":+m2.dataset.movep2); return; }
  const o=e.target.closest("[data-proj]");
  if(o){ switchProject(+o.dataset.proj); closeSheet(); return; }
  const b=e.target.closest("[data-pj]"); if(!b) return;
  const a=b.dataset.pj, cur=projects[projIdx];
  if(a==="new"){ newProject(); closeSheet(); return; }
  if(a==="rename"){ const nm=(prompt("Name this project:",cur.name)||"").trim(); if(!nm) return; cur.name=nm.slice(0,40); renderStrip(); save(); openProjects(); return; }
  if(a==="copy"){ if(takeLive()){ toast("stop the take first"); return; } if(playing) stop();
    const copy=JSON.parse(JSON.stringify(liveState())); projects[projIdx].data=liveState();
    projects.push({id:newId(),name:(cur.name+" copy").slice(0,40),data:copy}); loadProj(projects.length-1); closeSheet(); afterProj("copied"); return; }
  if(a==="del"){ if(projects.length<2){ toast("the last project stays: use New sketch in the menu to start over"); return; }
    if(!confirm('Delete "'+cur.name+'" and all its layers?')) return;
    if(playing) stop(); projects.splice(projIdx,1); loadProj(Math.max(0,Math.min(projIdx,projects.length-1))); closeSheet(); afterProj("project deleted"); return; }
});
/* =========================== SAVING, ALWAYS ============================
   0.23. autosave stays on after every change (no switch, ever). on top of it:
   a mirror in IndexedDB, a save when the page is hidden or closed, a ring of
   the last six distinct saves, and Save now / Recover in the menu. */
let saveT=0;
/* 0.26: the quick save (the browser's small store, about 5 MB) holds only the
   sketch itself. the six backups live on the device shelf, which has room, so a
   big sketch can no longer crowd its own autosave out. if the quick save is ever
   refused, the shelf still has it and you are told once. */
let saveWarned=false;
function save(){

}

}

function chanMap(list){
  const used=[...new Set(list.map(e=>e.inst))], m={}; let n=0;
  used.forEach(id=>{ if(id==="drums"){ m[id]=9; return; }
    m[id]=DB.MIDI_CH[n%DB.MIDI_CH.length]; n++; });
  Object.defineProperty(m,"_over",{value:Math.max(0,n-DB.MIDI_CH.length),enumerable:false});
  return m;
}
function layerTracks(){
  /* one track per layer that has sound. loops arrive already unrolled by mix(). */
  const mx=activeMix(), out=[];
  layers.forEach((l,i)=>{ const ev=mx.filter(e=>e.lay===l.id); if(!ev.length) return;
    out.push({l,i,name:IN(l.inst).n+" "+(i+1),ev}); });
  return out;
}
function midiBytes(){
  const tick=ms=>Math.round(ms/1000*bpm/60*DB.PPQ);
  const vlq=n=>{ let b=[n&0x7f]; n>>=7; while(n){ b.unshift((n&0x7f)|0x80); n>>=7; } return b; };
  const meta=(type,bytes)=>[...vlq(0),0xff,type,...vlq(bytes.length),...bytes];
  const text=s=>meta(0x03,[...unescape(encodeURIComponent(s))].map(c=>c.charCodeAt(0)&255));
  const chunk=trk=>{ trk.push(...vlq(0),0xff,0x2f,0x00); const L=trk.length;
    const o=[0x4d,0x54,0x72,0x6b,(L>>24)&255,(L>>16)&255,(L>>8)&255,L&255];
    for(let i=0;i<L;i++) o.push(trk[i]); return o; };
  const CH=chanMap(activeMix()), tr=layerTracks(), us=Math.round(60000000/bpm);
  const t0=[...text(fragName),...vlq(0),0xff,0x51,0x03,(us>>16)&255,(us>>8)&255,us&255,
            ...vlq(0),0xff,0x58,0x04,4,2,24,8];
  const tracks=[chunk(t0)];
  tr.forEach(t=>{
    const ch=CH[t.l.inst], list=[], trk=[...text(t.name)];
    if(t.l.inst!=="drums") trk.push(...vlq(0),0xc0|ch,IN(t.l.inst).pg);
    t.ev.forEach(e=>{ const n=e.pad?((DB.PADS.find(p=>p.id===e.pad)||{}).m||36):e.midi;
      list.push({t:tick(e.start),d:[0x90|ch,n&127,100]});
      list.push({t:tick(e.start+e.dur),d:[0x80|ch,n&127,0]}); });
    list.sort((a,b)=>a.t-b.t||(a.d[0]&0xf0)-(b.d[0]&0xf0));
    let last=0; list.forEach(ev=>{ trk.push(...vlq(ev.t-last),...ev.d); last=ev.t; });
    tracks.push(chunk(trk));
  });
  const nt=tracks.length, out=[0x4d,0x54,0x68,0x64,0,0,0,6,0,1,(nt>>8)&255,nt&255,(DB.PPQ>>8)&255,DB.PPQ&255];
  tracks.forEach(t=>{ for(let i=0;i<t.length;i++) out.push(t[i]); });
  return new Uint8Array(out);
}

/* =========================== WRITE IT DOWN ============================
   Free-timed ms events become notes on a grid: `grid` units per beat at
   `bpm`. Same note stream feeds MusicXML (a person) and ABC (an AI).
   One voice per layer: notes that start together become a chord, a chord
   ends when the next one starts. Ties across bar lines. Rests fill gaps. */
const unitMs=()=>60000/bpm/grid;
const PC_STEP=["C","C","D","D","E","F","F","G","G","A","A","B"], PC_ALT=[0,1,0,1,0,0,1,0,1,0,1,0];
function quantize(ev){
  const u=unitMs();
  const q=ev.map(e=>({s:Math.round(e.start/u),d:Math.max(1,Math.round(e.dur/u)),midi:e.midi,pad:e.pad,fx:e.fx}))
    .sort((a,b)=>a.s-b.s||a.midi-b.midi);
  const g=[];
  q.forEach(n=>{ const L=g[g.length-1];
    if(L&&L.s===n.s){ if(!L.n.some(x=>x.midi===n.midi&&x.pad===n.pad)) L.n.push(n); L.d=Math.max(L.d,n.d); }
    else g.push({s:n.s,d:n.d,n:[n]}); });
  g.forEach((c,i)=>{ if(g[i+1]) c.d=Math.max(1,Math.min(c.d,g[i+1].s-c.s)); });
  return g;
}
function tokens(groups){
  const barU=4*grid, out=[]; let pos=0;
  const push=tok=>{ let left=tok.units, first=true;
    while(left>0){ const take=Math.min(barU-(pos%barU),left);
      const t={...tok,units:take}; if(!tok.rest){ t.tieE=!first; t.tieS=left>take; }
      out.push(t); pos+=take; left-=take; first=false; } };
  groups.forEach(c=>{ if(c.s>pos) push({rest:true,units:c.s-pos}); push({n:c.n,units:c.d}); });
  const tail=pos%barU; if(tail) push({rest:true,units:barU-tail});
  return out;
}
function stdPieces(units){
  /* break a length into standard note values, largest first, tied together */
  const g=grid, STD=[[4,"whole",0],[3,"half",1],[2,"half",0],[1.5,"quarter",1],[1,"quarter",0],
    [.75,"eighth",1],[.5,"eighth",0],[.375,"16th",1],[.25,"16th",0]]
    .map(([q,t,d])=>[q*g,t,d]).filter(([u])=>u>=1&&Number.isInteger(u));
  const out=[]; let left=units;
  while(left>0){ const p=STD.find(([u])=>u<=left)||STD[STD.length-1]; out.push({units:p[0],type:p[1],dot:p[2]}); left-=p[0]; }
  return out;
}
function detectKey(midis){
  if(!midis.length) return {fifths:0,name:"C major"};
  const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],
        MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const h=new Array(12).fill(0); midis.forEach(m=>h[((m%12)+12)%12]++);
  const score=(p,r)=>{ let s=0; for(let i=0;i<12;i++) s+=h[(i+r)%12]*p[i]; return s; };
  let best={v:-1,pc:0,minor:false};
  for(let r=0;r<12;r++){ const a=score(MAJ,r), b=score(MIN,r);
    if(a>best.v) best={v:a,pc:r,minor:false}; if(b>best.v) best={v:b,pc:r,minor:true}; }
  const maj=best.minor?(best.pc+3)%12:best.pc; let f=(maj*7)%12; if(f>6) f-=12;
  const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  return {fifths:f,name:(f<0?FL:SH)[best.pc]+(best.minor?" minor":" major"),pc:best.pc,minor:best.minor};
}
function pitchedMidis(){ return activeMix().filter(e=>!e.pad).map(e=>e.midi); }
function musicXml(){

          if(fx.s&&!ni&&k===0) cur+='<direction placement="below"><direction-type><wedge type="crescendo"/></direction-type></direction>';

    '<score-partwise version="4.0"><work><work-title>'+x(fragName)+'</work-title></work>'+
    '<identification><encoding><software>The Scribe '+DB.version+'</software></encoding>'+

function abcOut(){
  const tr=layerTracks(), key=detectKey(pitchedMidis()), barU=4*grid;
  let s="X:1\nT:"+fragName+"\nC:The Scribe "+DB.version+"\nM:4/4\nL:1/"+(4*grid)+"\nQ:1/4="+bpm+"\nK:C\n"+
    "% feels like "+key.name+". every sharp is written on the note itself.\n"+
    "% drums voice: F=kick c=snare g=hats a=crash A=low tom d=mid tom e=high tom\n";
  const abcPitch=(midi,bar)=>{
    const p=((midi%12)+12)%12, oct=Math.floor(midi/12)-1, L=PC_STEP[p]; let acc="";
    if(PC_ALT[p]){ acc="^"; bar[L]=1; } else if(bar[L]){ acc="="; bar[L]=0; }
    let n=oct>=5?L.toLowerCase():L;
    if(oct>=6) n+="'".repeat(oct-5); else if(oct<=3) n+=",".repeat(4-oct);
    return acc+n; };
  const drumPitch=pad=>{ const st=DB.DRUM_STAFF[pad]||["C",5]; return st[1]>=5?st[0].toLowerCase():st[0]; };
  tr.forEach((t,i)=>{
    const drums=t.l.inst==="drums";
    s+="V:"+(i+1)+' name="'+t.name.replace(/"/g,"")+'"'+(drums?" clef=perc":"")+"\n";
    if(drums) s+="%%MIDI channel 10\n";
    let pos=0, bar={}, line="", bars=0;
    tokens(quantize(t.ev)).forEach(tok=>{
      if(tok.rest) line+="z"+tok.units;
      else { const ns=tok.n.map(n=>n.pad?drumPitch(n.pad):abcPitch(n.midi,bar)), fx=tok.n[0].fx||{};
        line+=(fx.t?"!trill!":"")+(fx.v?"!vibrato!":"")+(fx.r?"!roll!":"")+(fx.sl?"!slide!":"")+(fx.st?"!falloff!":"")+(fx.c?"!staccatissimo!":"")+(fx.h?"!doit!":"")+(fx.s?"!<(!":"")+(fx.f?"!>(!":"")+
          (ns.length>1?"["+ns.join("")+"]":ns[0])+tok.units+(tok.tieS?"-":"")+(fx.s?"!<)!":"")+(fx.f?"!>)!":""); }
      line+=" "; pos+=tok.units;
      if(pos%barU===0){ line+="| "; bar={}; bars++; if(bars%4===0) line+="\n"; }
    });
    s+=line.trim()+"\n";
  });

}

function setBpm(v){ bpm=clampBpm(v); const t=$("tv"); if(t) t.textContent=bpm; renderStrip(); if(view==="layers") drawScope(); if(view==="song") paint(); const fl=$("fitList"); if(fl) fl.innerHTML=fitRows(); save(); }
/* 0.25: does a repeating layer's own pulse fit the bars at this tempo? its natural
   length is the last note plus the usual gap between notes; its cycle is whole bars.
   off > 0: the next round comes in early by that much. */
function loopFit(l){
  if(!l.loop||!l.ev.length) return null;
  const ev=eventsOf(l).map(e=>e.start).sort((a,b)=>a-b); if(ev.length<3) return null;
  const g=[]; for(let i=1;i<ev.length;i++){ const d=ev[i]-ev[i-1]; if(d>60) g.push(d); } if(g.length<2) return null;
  g.sort((a,b)=>a-b); const gap=g[g.length>>1]; if((g[g.length-1]-g[0])/gap>.35) return null;
  const natural=ev[ev.length-1]+gap;
  const cyc=barSnap?loopBars(l)*barMs():layLen(l), off=Math.round(natural-cyc);
  if(Math.abs(off)<35||Math.abs(off)>barMs()/4) return {ok:true,off};
  const sug=[]; for(let k=1;k<=8;k++){ const b=Math.round(4*60000*k/natural); if(b>=DB.BPM_MIN&&b<=DB.BPM_MAX&&!sug.includes(b)) sug.push(b); }
  sug.sort((a,b)=>Math.abs(a-bpm)-Math.abs(b-bpm));
  return {ok:false,off,natural,sug:sug.slice(0,3)};
}
function fitRows(){
  const bad=layers.map(l=>({l,f:loopFit(l)})).filter(x=>x.f&&!x.f.ok);
  if(!bad.length) return '<p class="note">Every repeating layer fits this tempo.</p>';
  return bad.map(({l,f})=>'<div class="fitrow"><span style="color:'+IN(l.inst).c+'"><b>'+esc(laneName(l))+'</b>'+(l.mute?' (silenced)':'')+'</span>'+
    '<span class="fitoff">comes back '+Math.abs(f.off)+' ms '+(f.off>0?'early':'late')+'</span>'+
    '<span class="fitsug">fits at '+f.sug.map(b=>'<button class="btn sm zap" data-x="bpmset" data-v="'+b+'">'+b+'</button>').join('')+'</span></div>').join('');
}

/* =========================== AUDIO OUT (0.26) ===========================
   The sketch written to sound files, for a music app (FL Studio and friends):
   the whole mix as one .wav, or stems, one .wav per layer, zipped together.
   Nothing is recorded from the speakers: the same voices, the same shape, the
   same room are built again inside an offline context and rendered as fast as
   the device can go. 44.1 kHz, 16-bit, stereo. */
const WAV_SR=44100;
async function renderList(list,lenMs){
  boot(); if(ctx.resume) ctx.resume();
  await ensureLayers(true);
  const live={ctx,master,dry,revB,echoB,tailB};
  const oc=new OfflineAudioContext(2,Math.ceil((lenMs/1000+3.2)*WAV_SR),WAV_SR);
  OFF=true; ctx=oc;
  try{
    buildGraph(1);
    const q=applyJoins(list); linkFrom(q,1);
    q.forEach(ev=>fireEv(ev,.02+ev.start/1000,1));
  }finally{ OFF=false; ({ctx,master,dry,revB,echoB,tailB}=live); }
  return oc.startRendering();
}
function wavBytes(buf){
  const ch=buf.numberOfChannels, n=buf.length, out=new DataView(new ArrayBuffer(44+n*ch*2));
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) out.setUint8(o+i,str.charCodeAt(i)); };
  w(0,"RIFF"); out.setUint32(4,36+n*ch*2,true); w(8,"WAVE"); w(12,"fmt "); out.setUint32(16,16,true);
  out.setUint16(20,1,true); out.setUint16(22,ch,true); out.setUint32(24,buf.sampleRate,true);
  out.setUint32(28,buf.sampleRate*ch*2,true); out.setUint16(32,ch*2,true); out.setUint16(34,16,true);
  w(36,"data"); out.setUint32(40,n*ch*2,true);
  const data=[]; for(let c=0;c<ch;c++) data.push(buf.getChannelData(c));
  /* one peak for the whole file so nothing clips and the stems keep their balance */
  let o=44;
  for(let i=0;i<n;i++) for(let c=0;c<ch;c++){ const v=Math.max(-1,Math.min(1,data[c][i])); out.setInt16(o,v<0?v*32768:v*32767,true); o+=2; }
  return new Uint8Array(out.buffer);
}
function peakOf(buf){ let p=0; for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i+=2){ const v=d[i]<0?-d[i]:d[i]; if(v>p) p=v; } } return p; }
function scaleBuf(buf,k){ if(k===1) return; for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++) d[i]*=k; } }
/* a plain zip, stored not compressed: audio does not compress anyway */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipFiles(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  files.forEach(f=>{ const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true);
    c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm); off+=30+nm.length+sz; });
  const cl=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cl,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/zip"});
}
const safeName=s=>String(s||"sketch").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,40)||"sketch";
let rendering=false;
async function exportAudio(stems){
  if(rendering){ toast("already writing the audio"); return; }
  const mx=activeMix(); if(!mx.length){ toast("nothing to write down yet"); return; }
  if(playing) stop();
  rendering=true;
  const len=Math.max(...mx.map(e=>e.start+e.dur));
  try{
    if(!stems){
      toast("writing the mix…");
      const buf=await renderList(mx,len), pk=peakOf(buf); if(pk>.98) scaleBuf(buf,.98/pk);
      dl(safeName(fragName)+"_mix.wav",wavBytes(buf),"audio/wav"); toast("mix saved · "+(buf.duration).toFixed(1)+"s");
      return;
    }
    const tr=layerTracks(); if(!tr.length){ toast("nothing to write down yet"); return; }
    const bufs=[];
    for(let i=0;i<tr.length;i++){ toast("stem "+(i+1)+" of "+tr.length+" · "+tr[i].name);
      bufs.push(await renderList(tr[i].ev,len)); }
    /* one shared gain for every stem, so dropped into a DAW at 0 dB they add back up to the mix */
    const pk=Math.max(...bufs.map(peakOf)); const k=pk>.98?.98/pk:1;
    const files=bufs.map((b,i)=>{ scaleBuf(b,k); return {name:String(i+1).padStart(2,"0")+"_"+safeName(tr[i].name)+".wav",data:wavBytes(b)}; });
    files.push({name:"README.txt",data:new TextEncoder().encode(
      "The Scribe "+DB.version+" · "+fragName+"\n"+bpm+" beats per minute · 4/4 · 44.1 kHz 16-bit stereo\n"+
      "Every stem starts at the same instant (bar 1, beat 1) and has the same length.\nDrop them all at the start of the playlist and they line up.\n"+
      "The notes are also in the MIDI file (Menu, Write it down).\n\nTrack code (paste it into the Scribe to open this sketch):\n"+pack()+"\n")});
    const z=zipFiles(files), u=URL.createObjectURL(z), a=document.createElement("a");
    a.href=u; a.download=safeName(fragName)+"_stems.zip"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); },4000);
    toast(tr.length+" stems saved · "+Math.round(z.size/1048576)+" MB");
  }catch(err){ toast("could not write the audio: "+(err&&err.message||err)); }
  finally{ rendering=false; }
}

/* =========================== MIDI IN (0.26) =============================
   A MIDI file from FL Studio (or anywhere) comes back in as a new project: one
   layer per track and channel, channel 10 as drums on the nearest pads, the
   instrument picked from the program number, the tempo from the file. */
function readMidi(ab){
  const d=new Uint8Array(ab); let p=0;
  const u32=()=>{ const v=(d[p]<<24|d[p+1]<<16|d[p+2]<<8|d[p+3])>>>0; p+=4; return v; }, u16=()=>{ const v=d[p]<<8|d[p+1]; p+=2; return v; };
  const tag=()=>{ const t=String.fromCharCode(d[p],d[p+1],d[p+2],d[p+3]); p+=4; return t; };
  const vlq=()=>{ let v=0,b; do{ b=d[p++]; v=(v<<7)|(b&127); }while(b&128&&p<d.length); return v; };
  if(tag()!=="MThd") throw new Error("not a MIDI file");
  const hl=u32(), fmt=u16(), nt=u16(), div=u16(); p+=hl-6;
  if(div&0x8000) throw new Error("this MIDI file counts in frames, not beats");
  let tempo=500000; const notes=[], names={};
  for(let t=0;t<nt&&p<d.length;t++){
    if(tag()!=="MTrk"){ break; } const len=u32(), end=p+len; let tick=0, run=0; const on={}, prog={};
    while(p<end){ tick+=vlq(); let st=d[p];
      if(st&128){ p++; if(st<0xF0) run=st; } else st=run;
      if(st===0xFF){ const ty=d[p++], l=vlq();
        if(ty===0x51&&l===3&&tempo===500000) tempo=(d[p]<<16)|(d[p+1]<<8)|d[p+2];
        if(ty===0x03){ names[t]=new TextDecoder().decode(d.slice(p,p+l)); }
        p+=l; continue; }
      if(st===0xF0||st===0xF7){ p+=vlq(); continue; }
      const hi=st&0xF0, ch=st&15;
      if(hi===0xC0||hi===0xD0){ const v=d[p++]; if(hi===0xC0) prog[ch]=v; continue; }
      const a=d[p++], b=d[p++];
      if(hi===0x90&&b>0){ (on[ch*128+a]=on[ch*128+a]||[]).push(tick); }
      else if(hi===0x80||(hi===0x90&&b===0)){ const q=on[ch*128+a]; if(q&&q.length){ const s0=q.shift(); notes.push({t,ch,m:a,s:s0,e:tick,prog:prog[ch]||0}); } }
    }
    p=end;
  }
  return {notes,tempo,div,names,fmt};
}
function instForProg(pg){
  const ids=DB.IDS.filter(id=>id!=="drums");
  return ids.find(id=>IN(id).pg===pg)||ids.find(id=>Math.floor(IN(id).pg/8)===Math.floor(pg/8))||"piano";
}
function importMidi(file){
  if(takeLive()){ toast("stop the take first"); return; }
  file.arrayBuffer().then(ab=>{
    const m=readMidi(ab); if(!m.notes.length){ toast("that MIDI file has no notes in it"); return; }
    const msPerTick=m.tempo/1000/m.div, groups={};
    m.notes.forEach(n=>{ const k=n.t+"_"+n.ch; (groups[k]=groups[k]||[]).push(n); });
    const L=Object.keys(groups).slice(0,32).map(k=>{ const g=groups[k], drums=g[0].ch===9;
      const inst=drums?"drums":instForProg(g[0].prog);
      return {id:newId(),inst,sh:{...DB.SHAPE0},loop:false,mute:false,trimIn:0,trimOut:null,vol:1,even:0,pk:true,
        ev:g.slice(0,4000).map(n=>{ const start=Math.round(n.s*msPerTick), dur=Math.max(40,Math.round((n.e-n.s)*msPerTick));
          if(drums){ let best=DB.PADS[0],bd=99; DB.PADS.forEach(pd=>{ const dd=Math.abs(pd.m-n.m); if(dd<bd){ bd=dd; best=pd; } }); return {midi:best.m,pad:best.id,start,dur:Math.min(dur,400)}; }
          return {midi:clampM(n.m),pad:null,start,dur}; }).sort((a,b)=>a.start-b.start)}; });
    if(playing) stop();
    projects[projIdx].data=liveState();
    const nm=file.name.replace(/\.midi?$/i,"").slice(0,40)||"MIDI";
    projects.push({id:newId(),name:nm,data:{layers:L,song:[],bpm:clampBpm(60000000/m.tempo),anchorId:null,joins:[],notepad:""}});
    loadProj(projects.length-1); afterProj(nm+" · "+L.length+(L.length===1?" layer":" layers")+" from MIDI");
    closeSheet();
  }).catch(err=>toast("could not read that MIDI file: "+(err&&err.message||err)));
}
function pickMidi(){ const i=document.createElement("input"); i.type="file"; i.accept=".mid,.midi,audio/midi,audio/x-midi";

document.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.items||[]].some(x=>x.kind==="file")){ e.preventDefault(); document.body.classList.add("drop"); } });

    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(clickOn?" on":"")+'" data-x="click" id="clickB">'+(clickOn?"click while recording: on":"click while recording: off")+'</button>'+
    '<button class="qm" data-help="click" aria-label="What the click is">?</button></div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(barSnap?" on":"")+'" data-x="bars" id="barsB">'+(barSnap?"repeats on whole bars: on":"repeats on whole bars: off")+'</button>'+
    '<button class="qm" data-help="barsnap" aria-label="What bar repeats are">?</button></div>'+

    '<div class="row" style="margin-bottom:10px"><button class="btn sm'+(fitKeys?" on":"")+'" data-x="fitkeys" id="fitB">'+(fitKeys?"mark the keys that fit: on":"mark the keys that fit: off")+'</button>'+

    '<button class="qm" data-help="half" aria-label="What half speed is">?</button></div>'+

    '<button class="big ghost" data-m="menu" style="margin:0">Back to menu</button></div>');
}

$("bMenu").onclick=openMenu;
$("sheetIn").addEventListener("click",e=>{

      '<button class="mini" data-open="'+encodeURIComponent(n)+'">open</button>'+

      :'<p>No saved sketches yet.</p>')+'<button class="big ghost" data-close>Close</button>'); return; }
  if(a==="copy"){ const c=pack();
    (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject())
      .then(()=>{ toast("code copied"); showCode(c,true); }).catch(()=>showCode(c,true)); return; }
  if(a==="paste"){ showCode("",false); return; }

  if(a==="recover"){ openRecover(); return; }

    renderStrip(); paint(); save(); closeSheet(); toast("new sketch"); } return; }
});
$("sheetIn").addEventListener("click",e=>{
